    .side-foot { margin-top:auto; border-top:1px solid var(--line); padding-top:12px; } .settings-row { width:100%; border:0; background:transparent; color:var(--text); padding:10px 8px; display:flex;align-items:center;gap:9px;text-align:left;border-radius:11px;}.settings-row:hover {background:rgba(130,140,180,.1)}.key-dot { margin-left:auto; width:8px;height:8px;border-radius:50%;background:var(--danger);}.key-dot.ready{background:var(--green);box-shadow:0 0 0 4px color-mix(in srgb,var(--green) 15%,transparent);}
    .main { flex:1;min-width:0;display:flex;flex-direction:column;position:relative; }.topbar { height:72px;display:flex;align-items:center;gap:12px;padding:0 26px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.13);backdrop-filter:blur(18px); }.mobile-menu{display:none}.chat-avatar{width:38px;height:38px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#9a8cff,#5d72fb);color:#fff;font-size:19px}.title-block{flex:1;min-width:0}.title-block h1{font-size:15px;margin:0;font-weight:700}.title-block p{font-size:12px;margin:3px 0 0;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top-action { border:1px solid var(--line);color:var(--muted);background:var(--panel);border-radius:11px;padding:8px 10px;display:flex;gap:6px;align-items:center; }.top-action:hover{color:var(--text);background:var(--solid)}
    .messages { overflow-y:auto; flex:1;padding:30px max(24px,calc((100% - 900px)/2));scroll-behavior:smooth; }.empty { max-width:580px;margin:16vh auto;text-align:center;color:var(--muted);}.empty .empty-orb{width:78px;height:78px;margin:auto auto 20px;border-radius:28px;display:grid;place-items:center;color:#fff;font-size:34px;background:linear-gradient(140deg,#a88bff,#5476ff);box-shadow:0 16px 35px rgba(94,100,230,.3)}.empty h2{color:var(--text);font-size:24px;margin:0 0 10px;letter-spacing:-.04em}.empty p{line-height:1.7;margin:0}.suggestions{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:25px}.suggestion{border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--text);padding:9px 13px;font-size:13px}.suggestion:hover{border-color:var(--blue);color:var(--blue)}
    .message { display:flex;gap:12px;margin:0 0 23px;max-width:820px;position:relative; }.message.user { margin-left:auto; flex-direction:row-reverse; }.message .avatar { width:32px;height:32px;border-radius:11px;font-size:15px; }.message.user .avatar{background:linear-gradient(145deg,#4bbd9a,#218e80)}.msg-body{min-width:0;max-width:100%;position:relative}.msg-meta{font-size:12px;color:var(--muted);margin:1px 0 6px;display:flex;gap:7px;align-items:center}.msg-meta .who{display:inline-flex;align-items:center;font-weight:600;color:var(--text)}.mini-avatar{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:linear-gradient(145deg,#9a8cff,#5d72fb);color:#fff;font-size:11px;font-style:normal;margin-right:5px;flex:none}.message.user .mini-avatar{background:linear-gradient(145deg,#4bbd9a,#218e80)}.message.user .msg-meta{justify-content:flex-end}.bubble { position:relative; padding:13px 15px;line-height:1.65;font-size:14px;border:1px solid var(--line);border-radius:5px 18px 18px 18px;background:var(--solid);box-shadow:0 3px 15px rgba(25,30,60,.035);word-break:break-word; }.message.user .bubble { background:var(--bubble);border-radius:18px 5px 18px 18px; }.message-actions{position:absolute;right:0;top:100%;margin-top:4px;display:flex;gap:4px;opacity:.5;transition:opacity .18s;z-index:2}.message.user .message-actions{right:0;left:auto}.message:hover .message-actions{opacity:1}.message-actions button{width:26px;height:26px;border:1px solid var(--line);background:var(--solid);color:var(--muted);border-radius:8px;display:grid;place-items:center;padding:0;box-shadow:0 3px 9px rgba(0,0,0,.06)}.message-actions button svg{width:14px;height:14px}.message-actions button:hover{color:var(--blue);border-color:color-mix(in srgb,var(--blue) 40%,var(--line))}
    .bubble pre{overflow:auto;background:#151720;color:#eff2ff;padding:12px;border-radius:10px;font-size:12px;line-height:1.55}.bubble code{font-family:"SFMono-Regular",Consolas,monospace;background:color-mix(in srgb,var(--blue) 10%,transparent);padding:1px 4px;border-radius:4px}.bubble pre code{background:none;padding:0}.bubble blockquote{margin:8px 0;border-left:3px solid var(--blue);padding-left:10px;color:var(--muted)}.bubble h1,.bubble h2,.bubble h3{line-height:1.3;margin:12px 0 7px}.bubble h1{font-size:18px}.bubble h2{font-size:16px}.bubble h3{font-size:14px}.bubble p{margin:0 0 8px}.bubble p:last-child{margin-bottom:0}.bubble ul{padding-left:19px;margin:7px 0}.thinking .bubble{color:var(--muted);display:flex;align-items:center;gap:8px}.dots{display:inline-flex;gap:3px}.dots i{width:5px;height:5px;border-radius:50%;background:var(--blue);animation:bounce 1s infinite alternate}.dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}@keyframes bounce{to{transform:translateY(-5px);opacity:.4}}
    .composer-wrap{padding:12px max(24px,calc((100% - 900px)/2)) 19px;background:linear-gradient(transparent,var(--bg) 38%)}.composer {background:var(--panel);backdrop-filter:blur(26px) saturate(140%);border:1px solid var(--line);border-radius:20px;padding:10px;box-shadow:var(--shadow);}.composer textarea{display:block;width:100%;border:0;resize:none;outline:none;background:transparent;color:var(--text);padding:5px 7px;min-height:43px;max-height:145px;line-height:1.5}.composer-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:1px 2px 0 4px}.memory-switch{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;user-select:none}.memory-switch input{accent-color:var(--blue)}.send{width:36px;height:32px;border:0;border-radius:11px;background:var(--blue);color:#fff;display:grid;place-items:center;box-shadow:0 5px 12px rgba(69,103,246,.28)}.send:hover{background:#3659f1}.send:disabled{box-shadow:none}.shortcut{font-size:11px;color:var(--muted)}
    .overlay{display:none}.modal-layer{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(20,22,34,.32);backdrop-filter:blur(8px);z-index:20}.modal-layer.show{display:flex}.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:var(--solid);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.22)}.modal h2{font-size:19px;margin:0 0 4px}.modal .hint{color:var(--muted);font-size:13px;margin:0 0 20px;line-height:1.5}.form-group{margin:13px 0}.form-group label{display:block;font-size:12px;font-weight:650;margin-bottom:6px;color:var(--muted)}.form-group input,.form-group textarea,.form-group select{width:100%;border:1px solid var(--line);border-radius:11px;background:color-mix(in srgb,var(--solid) 85%,var(--bg));color:var(--text);outline:none;padding:10px 11px}.form-group textarea{min-height:90px;resize:vertical;line-height:1.5}.key-input{display:flex}.key-input input{border-radius:11px 0 0 11px;border-right:0}.key-input button{width:45px;border:1px solid var(--line);border-radius:0 11px 11px 0;background:var(--panel);color:var(--muted)}.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.btn{border:0;border-radius:11px;padding:10px 14px;font-size:13px}.btn.ghost{color:var(--text);background:rgba(130,140,180,.12)}.btn.primary{color:#fff;background:var(--blue)}.btn.danger{color:#fff;background:var(--danger)}.form-note{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.45}.status-card{display:flex;align-items:center;gap:9px;padding:11px;border-radius:12px;background:color-mix(in srgb,var(--green) 10%,transparent);font-size:13px;color:var(--green)}
    .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#252633;color:#fff;padding:11px 14px;border-radius:12px;font-size:13px;box-shadow:0 12px 30px rgba(0,0,0,.22);opacity:0;transition:.22s;pointer-events:none;z-index:40;max-width:calc(100% - 36px)}.toast.show{opacity:1;transform:translate(-50%,0)}

      .app{min-height:100dvh;height:100dvh;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}

      .sidebar.open{transform:translateX(0)}.overlay.show{display:block;position:fixed;inset:0;background:rgba(10,12,20,.38);z-index:2;backdrop-filter:blur(5px)}

      .main{min-height:0}.topbar{height:62px;min-height:62px;padding:0 11px;gap:9px;background:rgba(255,255,255,.28);border-bottom:0}.mobile-menu{display:grid}.chat-avatar{width:35px;height:35px;border-radius:12px;font-size:17px}.title-block h1{font-size:15px}.title-block p{max-width:128px;font-size:11px}.top-action{padding:0;width:38px;height:38px;display:grid;place-items:center;border-radius:13px;background:rgba(255,255,255,.34);font-size:17px}.top-action span{display:none}
      .messages{padding:18px 15px 8px;overscroll-behavior:contain}.message{gap:8px;margin-bottom:22px;max-width:100%}.message .avatar{width:30px;height:30px;border-radius:10px;font-size:13px}.msg-body{max-width:calc(100% - 39px)}.msg-meta{font-size:11px;margin:0 2px 5px}.bubble{padding:11px 13px;border-radius:5px 17px 17px 17px;font-size:14px;line-height:1.62;box-shadow:0 4px 14px rgba(25,30,60,.045)}.message.user .bubble{border-radius:17px 5px 17px 17px}.bubble pre{font-size:11px;padding:10px;margin:5px -2px;max-width:calc(100vw - 92px)}
      .composer-wrap{padding:7px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent 0%,var(--bg) 24%)}.composer{border-radius:22px;padding:8px 9px 8px 12px;background:color-mix(in srgb,var(--panel) 84%,transparent);box-shadow:0 12px 32px rgba(35,38,75,.14)}.composer textarea{min-height:37px;padding:6px 3px;font-size:15px}.composer-bottom{padding:1px 1px 0}.memory-switch{font-size:11px;gap:5px}.shortcut{display:none}.send{width:42px;height:38px;border-radius:14px;font-size:19px}.message-actions{opacity:.7;right:0}.message-actions button{width:28px;height:28px;border-radius:9px}
      .empty{margin:12vh auto 0;padding:0 12px}.empty .empty-orb{width:70px;height:70px;border-radius:24px;font-size:30px;margin-bottom:18px}.empty h2{font-size:22px}.empty p{font-size:14px;line-height:1.65}.suggestions{justify-content:flex-start;margin-top:22px;gap:7px}.suggestion{font-size:12px;padding:9px 11px;background:var(--panel)}
      .modal-layer{align-items:flex-end;padding:0}.modal{width:100%;max-height:88dvh;border-radius:25px 25px 0 0;padding:21px 18px calc(18px + env(safe-area-inset-bottom));animation:sheetIn .28s cubic-bezier(.2,.8,.2,1)}.modal::before{content:'';display:block;width:38px;height:4px;background:var(--line);border-radius:9px;margin:0 auto 17px}.modal h2{font-size:20px}.form-group input,.form-group textarea,.form-group select{font-size:16px;padding:11px}.btn{min-height:42px;padding:10px 16px}.toast{bottom:calc(16px + env(safe-area-inset-bottom));font-size:12px}
      @keyframes sheetIn{from{transform:translateY(100%)}to{transform:translateY(0)}}
    }
    /* Motion: quick tactile feedback, with a reduced-motion escape hatch. */
    .brand-mark{animation:brandFloat 4s ease-in-out infinite}
    .agent{transition:transform .2s ease,background .2s ease,border-color .2s ease,box-shadow .2s ease}
    .agent:hover{transform:translateX(2px)}.agent:active{transform:scale(.98)}
    .top-action{transition:transform .2s ease,background .2s ease,color .2s ease}.top-action:hover{transform:translateY(-1px)}.top-action:active{transform:scale(.95)}.clear-memory:hover{color:var(--danger)}
    .empty{animation:softEnter .55s cubic-bezier(.2,.8,.2,1) both}.empty .empty-orb{animation:orbDrift 5s ease-in-out infinite}
    .suggestion{transition:transform .2s ease,border-color .2s ease,color .2s ease}.suggestion:hover{transform:translateY(-2px)}.suggestion:active{transform:scale(.96)}
    .message:last-child{animation:messageIn .32s cubic-bezier(.2,.8,.2,1) both}
    .message-actions{transform:translateY(-3px);transition:opacity .18s ease,transform .18s ease}.message:hover .message-actions{transform:translateY(0)}
    .message-actions button{transition:color .18s ease,transform .18s ease}.message-actions button:hover{transform:translateY(-1px)}
    .composer{transition:border-color .2s ease,box-shadow .25s ease,transform .25s ease}.composer:focus-within{border-color:color-mix(in srgb,var(--blue) 45%,var(--line));box-shadow:0 16px 38px rgba(55,65,135,.18);transform:translateY(-2px)}
    .send{transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s ease,background .2s ease}.send:hover{transform:translateY(-2px);box-shadow:0 9px 18px rgba(69,103,246,.36)}.send:active{transform:scale(.91)}.send:disabled{transform:none}
    .toast{transform:translate(-50%,20px) scale(.96);transition:.28s cubic-bezier(.2,.8,.2,1)}.toast.show{transform:translate(-50%,0) scale(1)}
    @keyframes brandFloat{50%{transform:translateY(-2px) rotate(4deg)}}@keyframes orbDrift{50%{transform:translateY(-7px) rotate(4deg);box-shadow:0 21px 42px rgba(94,100,230,.36)}}@keyframes softEnter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes messageIn{from{opacity:0;transform:translateY(9px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
    .role-card{margin:20px auto 12px;max-width:430px;padding:14px 16px;text-align:left;border:1px solid var(--line);border-radius:16px;background:var(--panel);backdrop-filter:blur(18px);box-shadow:0 8px 25px rgba(45,51,91,.07)}.role-card span{display:block;margin-bottom:6px;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--blue);text-transform:uppercase}.role-card p{margin:0!important;color:var(--text);font-size:13px;line-height:1.65}.opening-line{max-width:430px;margin:0 auto;color:var(--muted);font-size:13px;font-style:italic;line-height:1.65}.empty .role-card+.opening-line+.suggestions{margin-top:18px}
    .attachment-preview{display:flex;align-items:center;gap:8px;margin:2px 2px 7px;padding:7px 9px;border-radius:11px;background:color-mix(in srgb,var(--blue) 10%,transparent);color:var(--blue);font-size:12px;font-weight:600;max-width:100%}.attachment-preview[hidden]{display:none}.attachment-preview::before{content:'📄'}.attachment-preview span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.attachment-preview button,.attach-file{border:0;background:transparent;color:var(--muted);cursor:pointer}.attachment-preview button{width:22px;height:22px;border-radius:50%;font-size:17px;line-height:1}.attachment-preview button:hover{background:rgba(130,140,180,.15);color:var(--danger)}.attach-file{width:28px;height:28px;border-radius:9px;font-size:22px;line-height:1;transition:background .2s ease,color .2s ease}.attach-file:hover{background:rgba(130,140,180,.14);color:var(--blue)}.composer-bottom .memory-switch{margin-right:auto}

    /* ===== 剧情状态栏 & 演绎排版 ===== */
    .status-bar{display:flex;gap:10px;align-items:stretch;padding:14px max(24px,calc((100% - 900px)/2)) 2px;flex-wrap:wrap}
    .status-bar .chip{flex:1;min-width:180px;border:1px solid var(--line);border-radius:14px;background:var(--panel);backdrop-filter:blur(14px);padding:10px 13px}
    .status-bar .chip .tag{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--blue);letter-spacing:.06em;text-transform:uppercase}
    .status-bar .chip .tag::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--blue)}
    .status-bar .chip.scene .tag::before{background:var(--green)}
    .status-bar .chip .val{margin-top:5px;font-size:13px;line-height:1.6;color:var(--text);white-space:pre-wrap;word-break:break-word}
    .status-bar .chip .val:empty::before{content:'（尚未设定）';color:var(--muted);opacity:.7}
    .status-bar .bar-btns{display:flex;flex-direction:column;gap:4px;align-items:stretch;flex:none;align-self:center}
    .status-bar .bar-btn{height:30px;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:10px;padding:0 10px;font-size:11px;display:flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap}
    .status-bar .bar-btn:hover{color:var(--text);background:var(--solid)}
    .bubble .dialogue{color:color-mix(in srgb,var(--blue) 78%,var(--text));font-weight:650}
    .bubble em{font-style:italic;color:var(--muted)}
    .bubble .status-inline{display:block;margin:2px 0 8px;padding:7px 10px;border-radius:9px;background:color-mix(in srgb,var(--blue) 8%,transparent);font-size:12.5px;color:color-mix(in srgb,var(--blue) 70%,var(--text))}
    .bubble .tag-line{display:block;margin:4px 0 10px;padding:6px 10px;border-radius:9px;background:color-mix(in srgb,var(--blue) 8%,transparent);font-size:12.5px;line-height:1.6;color:color-mix(in srgb,var(--blue) 70%,var(--text))}
    .bubble .tag-line b{color:var(--blue);font-weight:700;margin-right:3px}
    @media(max-width:720px){.status-bar{padding:10px 15px 2px;gap:8px}.status-bar .chip{min-width:calc(50% - 4px)}.status-bar .bar-btn{padding:0 10px;font-size:11px}}

  .mode-switch{display:flex;gap:4px;padding:4px;border-radius:13px;background:color-mix(in srgb,var(--text) 6%,transparent);margin:2px}
  .mode-btn{flex:1;border:0;background:transparent;color:var(--muted);border-radius:10px;padding:7px 2px;font-size:12.5px;font-weight:650;transition:.18s;display:flex;align-items:center;justify-content:center;gap:6px}.mode-btn svg{width:15px;height:15px;flex:none}
  .mode-btn.active{background:var(--solid);color:var(--text);box-shadow:0 3px 10px rgba(25,30,60,.08)}

  .app[data-mode="worldbook"] .topbar #editAgent,
  .app[data-mode="worldbook"] .topbar #restartChat,
  .app[data-mode="worldbook"] .topbar #clearAllMemory,
  .app[data-mode="worldbook"] .side-head,

  .wb-hero h2{font-size:26px;margin:0 0 10px;letter-spacing:-.03em}

  @media(max-width:720px){.wb-view{padding:20px 16px}.wb-hero h2{font-size:22px}}

</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><div class="brand-mark">✦</div> DeepSeek 剧场</div>
      <div class="mode-switch" id="modeSwitch"><button class="mode-btn active" data-mode="rp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5c3.4 0 6 2.3 6 5.4 0 1.7-.8 3.1-2 4-.4 1.8-1.6 3-3.9 3s-3.5-1.2-3.9-3c-1.2-.9-2-2.3-2-4 0-3.1 2.6-5.4 6-5.4z"/><path d="M9.4 9.4c.3 0 .5.2.5.5"/><path d="M14.1 9.4c.3 0 .5.2.5.5"/><path d="M9.8 13.2c.6-.5 1.4-.8 2.2-.8s1.6.3 2.2.8"/></svg><span>剧情演绎</span></button><button class="mode-btn" data-mode="worldbook"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6C10.5 5 9 4.5 7 4.5S3.5 5 2 6v11.5c1.5-1 3-1.5 5-1.5s3.5.5 5 1.5c1.5-1 3-1.5 5-1.5s3.5.5 5 1.5V6c-1.5-1-3-1.5-5-1.5S13.5 5 12 6z"/><path d="M12 6v11.5"/><path d="M7.5 8.5c1.2-.3 2.3-.3 3.5 0"/><path d="M16.5 8.5c-1.2-.3-2.3-.3-3.5 0"/><path d="M7.5 11c1.2-.3 2.3-.3 3.5 0"/><path d="M16.5 11c-1.2-.3-2.3-.3-3.5 0"/></svg><span>世界书</span></button></div>
      <div class="side-head"><span>我的智能体</span><button class="icon-btn" id="addAgent" title="创建智能体">＋</button></div>
      <div class="agent-list" id="agentList"></div>
      <div class="side-foot"><button class="settings-row" id="openSettings"><span>⚙︎</span> API 设置 <i class="key-dot" id="keyDot"></i></button></div>
    </aside>
    <div class="overlay" id="overlay"></div>
    <main class="main">
      <header class="topbar"><button class="icon-btn mobile-menu" id="menuButton">☰</button><div class="chat-avatar" id="chatAvatar">✦</div><div class="title-block"><h1 id="chatTitle">加载中</h1><p id="chatSubtitle"></p></div><button class="top-action" id="editAgent" title="编辑角色卡">✎ <span>角色卡</span></button><button class="top-action" id="restartChat" title="重启当前剧情">↻ <span>重启剧情</span></button><button class="top-action clear-memory" id="clearAllMemory" title="清空全部剧情记忆">⌫ <span>清空记忆</span></button></header>
      <div class="status-bar" id="statusBar"></div>
      <section class="messages" id="messages"></section>
      <div class="composer-wrap"><div class="composer"><div class="attachment-preview" id="attachmentPreview" hidden><span id="attachmentName"></span><button type="button" id="removeAttachment" title="移除附件">×</button></div><textarea id="prompt" placeholder="写下行动、对话或叙述…（支持 *动作* “台词” 【状态】标记）" aria-label="输入消息"></textarea><div class="composer-bottom"><button class="attach-file" id="attachFile" type="button" title="添加文本附件">＋</button><label class="memory-switch"><input id="memoryToggle" type="checkbox" checked> 保留剧情记忆</label><span class="shortcut">⌘ / Ctrl + Enter 发送</span><button class="send" id="sendButton" title="推进剧情">↑</button></div><input id="chatFileInput" type="file" accept=".txt,.md,.json,.csv,.html,.js,.ts,.py,.java,.c,.cpp,.css,text/plain,text/markdown,application/json,text/csv" hidden></div></div>
      <div class="wb-view" id="wbView" hidden><div class="wb-hero"><div class="wb-orb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6C10.5 5 9 4.5 7 4.5S3.5 5 2 6v11.5c1.5-1 3-1.5 5-1.5s3.5.5 5 1.5c1.5-1 3-1.5 5-1.5s3.5.5 5 1.5V6c-1.5-1-3-1.5-5-1.5S13.5 5 12 6z"/><path d="M12 6v11.5"/><path d="M7.5 8.5c1.2-.3 2.3-.3 3.5 0"/><path d="M16.5 8.5c-1.2-.3-2.3-.3-3.5 0"/></svg></div><h2>世界书模式</h2><p class="wb-desc">一个更宏大的创作舞台：多角色同场、事件随时间推进、正派与反派博弈、完整的剧情脉络。</p><div class="wb-features"><div class="wb-feat">多角色</div><div class="wb-feat">事件进展</div><div class="wb-feat">正派 / 反派</div><div class="wb-feat">剧情树</div><div class="wb-feat">世界设定</div></div><p class="wb-coming">即将上线，敬请期待</p><button class="wb-back" id="wbBackBtn">← 返回剧情演绎</button></div></div>
    </main>
  </div>
  <div class="modal-layer" id="modalLayer"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div>
  <script>
    const $ = s => document.querySelector(s);
    const now = () => Date.now();
    const uid = () => crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2);

    const defaults = [{id:'default',name:'雾城引路人',emoji:'✦',description:'沉浸式角色演绎 · 雾城篇',baseDirective:'',persona:'你是雾城的引路人，敏锐、克制、略带神秘感。你善于通过细节、对话和行动推动剧情。',userProfile:'你是失忆的旅人，正在雾城中寻找自己丢失的过去。',initialScene:'深夜的雾城街头，浓雾让人看不清三步之外。你与引路人并肩站在一座老旧的钟楼下。',relationship:'你是我的向导，也是唯一知道我失忆前秘密的人。'}];

    const state = {agents:[], activeId:'default', chats:{}, play:{}, globalPrompt:'', apiKey:'', apiBase:'https://api.deepseek.com', model:'deepseek-v4-flash', thinking:'off', temperature:1.3, topP:0.9, antiRepeat:true, repeatThreshold:0.55, memory:true, busy:false, attachment:null, mode:'rp'};
    const storeKey = 'deepseek-ai-studio-v1';
    const ICON_COPY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
    const ICON_REGEN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>';
    const ICON_UNDO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>';


    function safeParse(raw, fallback){ try { const data=JSON.parse(raw); return data && typeof data==='object' ? data : fallback; } catch { return fallback; } }

    function loadState(){
      const saved = safeParse(localStorage.getItem(storeKey), {});
      state.agents = Array.isArray(saved.agents) && saved.agents.length ? saved.agents : defaults;
      state.activeId = state.agents.some(a=>a.id===saved.activeId) ? saved.activeId : state.agents[0].id;
      state.chats = saved.chats && typeof saved.chats==='object' ? saved.chats : {};
      state.play = saved.play && typeof saved.play==='object' ? saved.play : {};
      state.globalPrompt = typeof saved.globalPrompt==='string' ? saved.globalPrompt : '';
      state.model = typeof saved.model==='string' && saved.model.trim() ? saved.model.trim() : 'deepseek-v4-flash';
      state.thinking = ['off','high','max'].includes(saved.thinking) ? saved.thinking : 'off';
      state.temperature = typeof saved.temperature==='number' ? saved.temperature : 1.3;
      state.topP = typeof saved.topP==='number' ? saved.topP : 0.9;
      state.antiRepeat = saved.antiRepeat !== false;
      state.repeatThreshold = typeof saved.repeatThreshold==='number' ? saved.repeatThreshold : 0.55;
      state.memory = saved.memory !== false;
      state.mode = saved.mode==='worldbook' ? 'worldbook' : 'rp';
      state.apiBase = typeof saved.apiBase==='string' && saved.apiBase.trim() ? saved.apiBase.trim().replace(/\/+$/,'') : 'https://api.deepseek.com';
      state.apiKey = '';
      try { const encrypted = localStorage.getItem(storeKey+'-key'); if(encrypted) state.apiKey = atob(encrypted); } catch {}
    }

    function saveState(){
      const clean = {agents:state.agents, activeId:state.activeId, chats:state.chats, play:state.play, globalPrompt:state.globalPrompt, apiBase:state.apiBase, model:state.model, thinking:state.thinking, temperature:state.temperature, topP:state.topP, antiRepeat:state.antiRepeat, repeatThreshold:state.repeatThreshold, memory:state.memory, mode:state.mode, savedAt:now(), version:2};
      try { localStorage.setItem(storeKey, JSON.stringify(clean)); } catch(e){ toast('保存失败：本地存储空间不足'); }
      if(state.apiKey) localStorage.setItem(storeKey+'-key', btoa(state.apiKey));
      else localStorage.removeItem(storeKey+'-key');
      updateKeyStatus();
    }

    function activeAgent(){ return state.agents.find(a=>a.id===state.activeId)||state.agents[0]; }
    function apiEndpoint(){ let base=(state.apiBase||'https://api.deepseek.com').trim().replace(/\/+$/,''); if(/\/chat\/completions$/i.test(base)) return base; return base+'/chat/completions'; }
    function chat(){ if(!Array.isArray(state.chats[state.activeId])) state.chats[state.activeId]=[]; return state.chats[state.activeId]; }
    function play(){ if(!state.play) state.play={}; if(!state.play[state.activeId]) state.play[state.activeId]={roleState:'',scene:'',summaries:[],summarizedUpTo:0}; const p=state.play[state.activeId]; if(typeof p.summary==='string'&&p.summary){ if(!Array.isArray(p.summaries)||!p.summaries.length) p.summaries=[p.summary]; delete p.summary; } if(!Array.isArray(p.summaries)) p.summaries=[]; return p; }
    function escapeHtml(text){ return String(text).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])); }

    // 从 AI 回复中解析出【状态】【场景】，其余归为正文
    function parseReply(content){
      const lines = String(content||'').split('\n');
      let roleState = null, scene = null;
      const body = [];
      for(const line of lines){
        const s = line.trim();
        if(s.startsWith('【状态】')){ const t = s.slice(4).trim(); if(t) roleState = t; body.push(line); continue; }
        if(s.startsWith('【场景】')){ const t = s.slice(4).trim(); if(t) scene = t; continue; }
        body.push(line);
      }
      return { roleState, scene, body: body.join('\n').trim() };
    }

    function inlineMd(s){
      return String(s)
        .replace(/[“"]([^“”"\n]+)[”"]/g,'<span class="dialogue">$&</span>')
        .replace(/`([^`]+)`/g,'<code>$1</code>')
        .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
        .replace(/(^|[^*\w])\*([^*\n]+?)\*(?!\*)/g,'$1<em>$2</em>');
    }
    function markdown(text){
      const lines = escapeHtml(text).split('\n');
      const out = [];
      let para = [], codeBuf = null, list = null;
      const flushPara = ()=>{ if(para.length){ out.push('<p>'+para.join('<br>')+'</p>'); para=[]; } };
      const flushList = ()=>{ if(list){ out.push('<'+list.type+'>'+list.items.join('')+'</'+list.type+'>'); list=null; } };
      for(let i=0;i<lines.length;i++){
        const line = lines[i];
        if(codeBuf !== null){
          if(/^\s*```/.test(line)){ out.push('<pre><code>'+codeBuf.join('\n')+'</code></pre>'); codeBuf=null; }
          else codeBuf.push(line);
          continue;
        }
        if(/^\s*```/.test(line)){ flushPara(); flushList(); codeBuf=[]; continue; }
        const li = line.match(/^\s*[-*]\s+(.*)$/);
        if(li){ flushPara(); if(!list || list.type!=='ul'){ flushList(); list={type:'ul',items:[]}; } list.items.push('<li>'+inlineMd(li[1])+'</li>'); continue; }
        const oli = line.match(/^\s*\d+\.\s+(.*)$/);
        if(oli){ flushPara(); if(!list || list.type!=='ol'){ flushList(); list={type:'ol',items:[]}; } list.items.push('<li>'+inlineMd(oli[1])+'</li>'); continue; }
        flushList();
        if(/^\s*###\s+/.test(line)){ flushPara(); out.push('<h3>'+inlineMd(line.replace(/^\s*###\s+/,''))+'</h3>'); continue; }
        if(/^\s*##\s+/.test(line)){ flushPara(); out.push('<h2>'+inlineMd(line.replace(/^\s*##\s+/,''))+'</h2>'); continue; }
        if(/^\s*#\s+/.test(line)){ flushPara(); out.push('<h1>'+inlineMd(line.replace(/^\s*#\s+/,''))+'</h1>'); continue; }
        if(/^\s*&gt;\s*/.test(line)){ flushPara(); out.push('<blockquote>'+inlineMd(line.replace(/^\s*&gt;\s*/,''))+'</blockquote>'); continue; }
        const tag = line.match(/^\s*【([^】]{1,12})】\s*(.*)$/);
        if(tag){ flushPara(); out.push('<div class="tag-line"><b>【'+tag[1]+'】</b>'+(tag[2]?inlineMd(tag[2]):'')+'</div>'); continue; }
        if(line.trim()===''){ flushPara(); continue; }
        para.push(inlineMd(line));
      }
      if(codeBuf !== null) out.push('<pre><code>'+codeBuf.join('\n')+'</code></pre>');
      flushPara(); flushList();
      return out.join('');
    }

    function bigrams(s){ const t=String(s||'').replace(/\s+/g,'').toLowerCase(); const g=new Set(); for(let i=0;i<t.length-1;i++) g.add(t.slice(i,i+2)); return g; }
    function similarity(a,b){ const A=bigrams(a), B=bigrams(b); if(!A.size||!B.size) return 0; let n=0; for(const x of A) if(B.has(x)) n++; return n/(A.size+B.size-n); }

    function relative(ts){ const sec=Math.max(0,Math.floor((now()-ts)/1000)); if(sec<45)return '刚刚'; if(sec<3600)return Math.floor(sec/60)+' 分钟前'; if(sec<86400)return Math.floor(sec/3600)+' 小时前'; return new Date(ts).toLocaleDateString('zh-CN',{month:'numeric',day:'numeric'}); }

    function renderAgents(){ $('#agentList').innerHTML=state.agents.map(a=>`<button class="agent ${a.id===state.activeId?'active':''}" data-agent="${a.id}"><div class="avatar">${escapeHtml(a.emoji||'✦')}</div><div class="agent-info"><div class="agent-name">${escapeHtml(a.name)}</div><div class="agent-desc">${escapeHtml(a.description||'未设置人设')}</div></div></button>`).join(''); $('#agentList').querySelectorAll('[data-agent]').forEach(el=>el.onclick=()=>{state.activeId=el.dataset.agent;saveState();render();closeSide();}); }

    function renderMessages(){ const list=chat(), agent=activeAgent(), host=$('#messages'); if(!list.length){ host.innerHTML=`<div class="empty"><div class="empty-orb">${escapeHtml(agent.emoji||'✦')}</div><h2>你好，我是${escapeHtml(agent.name)}</h2><div class="role-card"><span>剧情初始环境</span><p>${escapeHtml(agent.initialScene||agent.description||'故事正等待你的选择。')}</p></div><div class="suggestions"><button class="suggestion">从开场继续</button><button class="suggestion">让冲突升级</button><button class="suggestion">描述周围的细节</button></div></div>`; host.querySelectorAll('.suggestion').forEach(b=>b.onclick=()=>{$('#prompt').value=b.textContent;$('#prompt').focus();}); return; } host.innerHTML=list.map(m=>`<article class="message ${m.role==='user'?'user':''}" data-id="${m.id}"><div class="msg-body"><div class="msg-meta"><span class="who"><i class="mini-avatar">${m.role==='user'?'我':escapeHtml(agent.emoji||'✦')}</i>${m.role==='user'?'你':escapeHtml(agent.name)}</span><span>·</span><time title="${new Date(m.createdAt).toLocaleString('zh-CN')}">${relative(m.createdAt)}</time></div><div class="bubble">${markdown(m.displayContent||m.content)}</div><div class="message-actions"><button data-action="copy" title="复制">${ICON_COPY}</button>${m.role==='assistant'?'<button data-action="regen" title="重新生成">'+ICON_REGEN+'</button>':''}${m.role==='user'?'<button data-action="undo" title="撤回">'+ICON_UNDO+'</button>':''}</div></div></article>`).join(''); host.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>messageAction(b.closest('.message').dataset.id,b.dataset.action)); host.scrollTop=host.scrollHeight; }

    function renderStatus(){
      const p = play();
      $('#statusBar').innerHTML = `<div class="chip scene"><div class="tag">当前场景</div><div class="val">${escapeHtml(p.scene||'')}</div></div><div class="bar-btns"><button class="bar-btn" id="editStatusBtn" title="编辑场景/摘要">✎ 编辑</button><button class="bar-btn" id="genSummaryBtn" title="把当前对话压缩成剧情摘要（长记忆）">⧉ 生成摘要</button></div>`;
      $('#editStatusBtn').onclick = openStatusEditor;
      $('#genSummaryBtn').onclick = generateSummary;
    }

    function render(){ document.querySelector('.app').dataset.mode = state.mode; document.querySelectorAll('.mode-btn').forEach(b=>b.classList.toggle('active', b.dataset.mode===state.mode)); const agent=activeAgent(); const p=play(); if(state.mode==='worldbook'){ $('#chatTitle').textContent='世界书'; $('#chatSubtitle').textContent='多角色 · 事件进展 · 正反派 · 剧情'; } else { if(!p._init){ p._init=true; if(!p.scene) p.scene=agent.initialScene||''; } $('#chatAvatar').textContent=agent.emoji||'✦';$('#chatTitle').textContent=agent.name;$('#chatSubtitle').textContent=agent.relationship||agent.description||'未设置角色关系'; } $('#memoryToggle').checked=state.memory; renderAgents();renderMessages();renderStatus();updateKeyStatus(); }

    function updateKeyStatus(){ $('#keyDot').classList.toggle('ready',!!state.apiKey); $('#keyDot').title=state.apiKey?'API 密钥已设置':'未设置 API 密钥'; }

    function toast(msg){ const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2600); }

    async function copy(text){ try{await navigator.clipboard.writeText(text);toast('已复制到剪贴板');}catch{toast('复制失败，请手动复制');} }

    function messageAction(id,action){ const messages=chat(),index=messages.findIndex(m=>m.id===id),m=messages[index]; if(!m)return; if(action==='copy')return copy(m.displayContent||m.content); if(action==='undo'){ const isLastTurn=m.role==='user'&&(index===messages.length-1||(index===messages.length-2&&messages.at(-1)?.role==='assistant')); if(!isLastTurn)return toast('只能撤回最后一轮对话'); messages.splice(index);saveState();renderMessages();toast('已撤回最后一轮对话'); } if(action==='regen'){ if(state.busy)return; if(index!==messages.length-1||m.role!=='assistant')return toast('只能重新生成最后一条 AI 回复'); const previous=messages[index-1]; if(!previous||previous.role!=='user')return toast('没有可用于重新生成的上一条提问'); messages.pop();saveState();renderMessages();sendMessage(previous.content,true); } }

    function buildSystem(){
      const a = activeAgent();
      const p = play();

    function classifyError(e){ const msg=String(e.message||e); if(/401|403|unauthorized|permission/i.test(msg))return '密钥无效或没有访问权限，请检查 API Key。'; if(/402|insufficient|balance/i.test(msg))return '账户余额不足，请前往 DeepSeek 平台充值。'; if(/429|rate limit/i.test(msg))return '请求过于频繁或额度已用尽，请稍后再试。'; if(/model not exist|invalid model/i.test(msg))return '模型名称无效，请在设置中重新选择模型。'; if(/network|fetch|failed to fetch/i.test(msg))return '网络请求失败，请检查网络连接或浏览器跨域限制。'; return '请求失败：'+msg.slice(0,100); }

    function buildPayload(extraUserNote){
      const history = chat().filter(m=>m.id!=='thinking');
      const messages = [];
      const system = buildSystem();
      if(system) messages.push({role:'system', content:system});
      const context = state.memory ? history.slice(-12) : history.slice(-1);
      context.forEach(m=>messages.push({role:m.role, content:m.content}));
      if(extraUserNote) messages.push({role:'user', content:extraUserNote});
      const payload = { model: state.model, messages, stream: true, max_tokens: 8192 };
      if(state.thinking === 'off'){
        payload.temperature = Number(state.temperature ?? 1.3);
        payload.top_p = Number(state.topP ?? 0.9);
      } else {
        payload.thinking = { type:'enabled' };
        payload.reasoning_effort = state.thinking;
      }
      return payload;
    }

    async function streamDeepSeek(payload, onDelta){
      const res = await fetch(apiEndpoint(), {
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+state.apiKey},
        body: JSON.stringify(payload)
      });
      if(!res.ok){
        let detail='';
        try { detail=(await res.json()).error?.message || ''; } catch {}
        throw new Error(res.status+' '+detail);
      }
      if(!res.body){
        const data = await res.json();
        const content = data.choices?.[0]?.message?.content;
        if(!content) throw new Error('API 未返回可用内容');
        onDelta(content);
        return content;
      }
      const reader = res.body.getReader();
      const decoder = new TextDecoder('utf-8');
      let buffer = '', content = '';
      while(true){
        const {done, value} = await reader.read();
        if(done) break;
        buffer += decoder.decode(value, {stream:true});
        const parts = buffer.split('\n');
        buffer = parts.pop() || '';
        for(const line of parts){
          const s = line.trim();
          if(!s.startsWith('data:')) continue;
          const data = s.slice(5).trim();
          if(data === '[DONE]') continue;
          let json; try { json = JSON.parse(data); } catch { continue; }
          const delta = json.choices?.[0]?.delta || {};
          if(delta.content){ content += delta.content; onDelta(content); }
        }
      }
      if(!content) throw new Error('API 未返回可用内容');
      return content;
    }

    async function sendMessage(text, regenerate=false){
      text = text.trim();
      const attachment = state.attachment;
      if((!text && !attachment) || state.busy) return;
      if(!state.apiKey){ openSettings(); toast('请先设置 DeepSeek API 密钥'); return; }
      const messages = chat();
      let userRepeatNote = '';
      if(!regenerate){
        const fileBlock = attachment ? '\n\n【用户上传的文件：'+attachment.name+'】\n'+attachment.content : '';
        const display = [text || '请阅读我上传的文件。', attachment ? '📎 已附加：'+attachment.name : ''].filter(Boolean).join('\n\n');
        messages.push({id:uid(), role:'user', content:text+fileBlock, displayContent:display, attachmentName:attachment?.name, createdAt:now()});
        state.attachment = null;
        renderAttachment();
        $('#prompt').value=''; autoResize();
        if(state.antiRepeat){ const newContent=messages[messages.length-1].content; const prevUsers=messages.filter(m=>m.role==='user').slice(-4,-1); if(prevUsers.length){ const sim=Math.max(...prevUsers.map(p=>similarity(newContent,p.content||''))); if(sim>=0.45) userRepeatNote='（系统提示：用户这次的输入与之前某轮高度相似，不要重复之前给过的类似答复；请从新的角度、新的细节或新的推进方式回应，给出明显不同的内容。）'; } }
      }
      state.busy = true; $('#sendButton').disabled = true;
      saveState(); renderMessages(); renderStatus();

      const thinking = {id:'thinking', role:'assistant', content:'', createdAt:now()};
      messages.push(thinking);
      renderMessages();
      const dots = '思考中 <span class="dots"><i></i><i></i><i></i></span>';

      let rafPending = false;
      const paint = (text)=>{
        if(messages.indexOf(thinking) === -1) return;
        if(rafPending) return;
        rafPending = true;
        requestAnimationFrame(()=>{
          rafPending = false;
          const el = document.querySelector('.message[data-id="thinking"] .bubble');
          const body = parseReply(text).body;
          if(el) el.innerHTML = body ? markdown(body) : dots;
          const host = $('#messages');
          const nearBottom = host.scrollHeight - host.scrollTop - host.clientHeight < 120;
          if(nearBottom) host.scrollTop = host.scrollHeight;
        });
      };
      const thinkingEl = document.querySelector('.message[data-id="thinking"] .bubble');
      if(thinkingEl) thinkingEl.innerHTML = dots;

      try {
        let attempt = 0, note = userRepeatNote, reply = '';
        while(attempt < 2){
          attempt++;
          reply = await streamDeepSeek(buildPayload(note), paint);
          const parsed = parseReply(reply);
          if(state.antiRepeat && attempt === 1){
            const prev = messages.filter(m=>m.role==='assistant' && m.id!=='thinking').slice(-2).map(m=>m.content||'');
            const sim = prev.length ? Math.max(...prev.map(p=>similarity(reply,p))) : 0;
            if(sim >= (state.repeatThreshold ?? 0.55)){
              note = '（系统强制要求：你刚才的回复与此前内容高度重复，请完全更换角度、动作、措辞与场景细节，重新给出有实质新推进的演绎，禁止重复。）';
              continue;
            }
          }
          const p = play();
          if(parsed.roleState) p.roleState = parsed.roleState;
          if(parsed.scene) p.scene = parsed.scene;
          const ix = messages.indexOf(thinking);
          if(ix > -1) messages.splice(ix, 1, {id:uid(), role:'assistant', content:reply, displayContent:parsed.body, createdAt:now()});
          break;
        }
        saveState(); renderMessages(); renderStatus();
        maybeAutoSummarize();
      } catch(e){
        const ix = messages.indexOf(thinking);
        if(ix > -1) messages.splice(ix, 1);
        saveState(); renderMessages(); renderStatus();
        toast(classifyError(e));
      } finally {
        state.busy = false; $('#sendButton').disabled = false;
      }
    }

    async function callSummarize(segmentText, existing){
      const sys = '你是剧情记忆整理助手。请把「已有的剧情摘要」与「新增对话内容」合并成一份更完整、更详细的剧情摘要。\n\n【硬性要求】\n1. 必须保留已有摘要中的全部关键信息，只做增量补充和必要的合并去重，绝不能丢弃已有摘要里已有的具体事实。\n2. 按以下结构分条目输出（每类信息单独成段，互不挤压）：\n【剧情主线】用 1-2 句概括当前主线走向；\n【事件时间线】按发生顺序逐条列出已发生的关键事件，每条一句；\n【人物关系】各人物的当前状态、立场、与对话人的关系变化；\n【伏笔与线索】尚未回收的伏笔、未解之谜、待办事项；\n【重要细节】关键物品、地点、承诺、约定、容易被遗忘的具体信息。\n3. 只陈述剧情事实，不评价、不建议、不脑补原文没有的内容。\n4. 总长度控制在 800 字以内，优先保留具体事实（人名、物品、数字、承诺），宁可多留细节也不省略。';
      const messages = [{role:'system', content:sys}];
      let input = '';
      if(existing && existing.length) input += '【已有的剧情摘要】\n'+existing.join('\n---\n')+'\n\n';
      input += '【新增对话内容】\n'+segmentText;
      messages.push({role:'user', content:input});
      const payload = { model:state.model, messages, stream:false, max_tokens:2500, thinking:{type:'disabled'}, temperature:0.4 };
      const res = await fetch(apiEndpoint(), { method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+state.apiKey}, body:JSON.stringify(payload) });
      if(!res.ok){ let d=''; try{d=(await res.json()).error?.message||''}catch{} throw new Error(res.status+' '+d); }
      const data = await res.json();
      const text = data.choices?.[0]?.message?.content;
      if(!text) throw new Error('API 未返回摘要');
      return text.trim();
    }

    async function doSummarize(fromIdx, toIdx, silent){
      const p = play();
      const list = chat();
      const segment = list.slice(fromIdx, toIdx).map(m=>(m.role==='user'?'对话人':'角色')+'：'+(m.content||'')).join('\n');
      if(!segment.trim()) return;
      const text = await callSummarize(segment, p.summaries);
      if(!text) return;
      p.summaries.push(text);
      if(p.summaries.length > 3) p.summaries.shift();
      p.summarizedUpTo = toIdx;
      saveState(); renderStatus();
      toast(silent ? ('已自动归档第 '+p.summaries.length+' 段剧情摘要') : '剧情摘要已生成并归档（保留最近 3 段）');
    }

    function maybeAutoSummarize(){
      if(state.summarizing || state.busy) return;
      const p = play();
      const total = chat().length;
      const done = p.summarizedUpTo || 0;
      if(total - done >= 16){
        state.summarizing = true;
        doSummarize(done, total, true).catch(()=>{}).finally(()=>{ state.summarizing = false; });
      }
    }

    async function generateSummary(){
      const list = chat();
      if(list.length < 4) return toast('对话还太少，暂不需要生成摘要');
      if(state.busy || state.summarizing) return;
      if(!state.apiKey){ openSettings(); toast('请先设置 API 密钥'); return; }
      state.busy = true; $('#sendButton').disabled = true;
      toast('正在生成剧情摘要…');
      try {
        const p = play();
        await doSummarize(p.summarizedUpTo || 0, list.length, false);
      } catch(e){ toast(classifyError(e)); }
      finally { state.busy = false; $('#sendButton').disabled = false; }
    }

      const edit = !!agent;
      agent = agent || {id:uid(), name:'', emoji:'✦', description:'', baseDirective:'', persona:'', initialScene:'', relationship:'', userProfile:''};
      openModal(`<h2>${edit?'编辑角色':'创建角色'}</h2><p class="hint">只提供角色的人设与世界观环境即可，开场白与剧情走向交给 AI 自行想象。</p><div class="form-group"><label>角色名称</label><input id="agentName" maxlength="24" placeholder="例如：雾城引路人" value="${escapeHtml(agent.name)}"></div><div class="form-group"><label>图标 Emoji</label><input id="agentEmoji" maxlength="4" value="${escapeHtml(agent.emoji||'✦')}"></div><div class="form-group"><label>角色简介</label><input id="agentDesc" maxlength="60" placeholder="例如：沉浸式悬疑剧情演绎" value="${escapeHtml(agent.description||'')}"></div><div class="form-group"><label>角色底层输出设定 <small>（最高优先级）</small></label><textarea id="baseDirective" placeholder="强制规则：角色说话的语气风格、绝对不能做的事、必须遵守的输出规范…（优先级高于其余所有设定）">${escapeHtml(agent.baseDirective||'')}</textarea></div><div class="form-group"><label>角色人设</label><textarea id="agentPersona" placeholder="性格、语言习惯、目标、秘密…">${escapeHtml(agent.persona||'')}</textarea></div><div class="form-group"><label>我的设定（你扮演的角色）</label><textarea id="userProfile" placeholder="我是谁？身份、形象、性格、目标、秘密…（留空则让 AI 自行推断）">${escapeHtml(agent.userProfile||'')}</textarea></div><div class="form-group"><label>剧情初始环境</label><textarea id="initialScene" placeholder="剧情开始时，角色和用户所处的地点、时间、天气、气氛、正在发生的事…">${escapeHtml(agent.initialScene||'')}</textarea></div><div class="form-group"><label>你与角色的关系</label><input id="agentRelationship" maxlength="100" placeholder="例如：他是你失忆后唯一信任的向导" value="${escapeHtml(agent.relationship||'')}"></div><input id="roleFileInput" type="file" accept=".json,.txt,.md,text/plain,application/json" hidden><div class="form-group"><button type="button" class="btn ghost" id="importRoleButton">↥ 导入角色设定</button><div class="form-note">支持 JSON 角色卡，或 TXT / Markdown 世界书（最大 300 KB）。文件仅在本机解析。</div></div><div class="modal-footer">${edit&&state.agents.length>1?'<button class="btn danger" id="deleteAgent">删除</button>':''}<span style="flex:1"></span><button class="btn ghost" id="cancel">取消</button><button class="btn primary" id="saveAgent">保存角色</button></div>`,()=>{$('#cancel').onclick=closeModal;$('#importRoleButton').onclick=()=>$('#roleFileInput').click();$('#roleFileInput').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;if(file.size>300*1024){toast('文件不能超过 300 KB');e.target.value='';return;}try{const raw=(await file.text()).trim();if(!raw)throw new Error('文件为空');if(file.name.toLowerCase().endsWith('.json')){const source=JSON.parse(raw);const card={name:source.name||source.characterName,emoji:source.emoji||source.avatar,description:source.description||source.summary,baseDirective:source.baseDirective||source.directive,persona:source.persona||source.personality||source.character,initialScene:source.initialScene||source.scene,relationship:source.relationship,userProfile:source.userProfile||source.userPersona||source.myProfile};const fields={name:'agentName',emoji:'agentEmoji',description:'agentDesc',baseDirective:'baseDirective',persona:'agentPersona',initialScene:'initialScene',relationship:'agentRelationship',userProfile:'userProfile'};Object.entries(fields).forEach(([key,id])=>{if(card[key]!==undefined&&card[key]!==null)$('#'+id).value=typeof card[key]==='string'?card[key]:JSON.stringify(card[key]);});toast('角色卡已导入');}else{$('#initialScene').value=raw;toast('文本已导入到剧情初始环境');}}catch(err){toast('导入失败：请使用有效的 JSON、TXT 或 Markdown 文件');}finally{e.target.value='';}};$('#saveAgent').onclick=()=>{const name=$('#agentName').value.trim();if(!name)return toast('请填写角色名称');const data={...agent,name,emoji:$('#agentEmoji').value.trim()||'✦',description:$('#agentDesc').value.trim(),baseDirective:$('#baseDirective').value.trim(),persona:$('#agentPersona').value.trim(),initialScene:$('#initialScene').value.trim(),relationship:$('#agentRelationship').value.trim(),userProfile:$('#userProfile').value.trim()};if(edit)state.agents=state.agents.map(a=>a.id===data.id?data:a);else{state.agents.push(data);state.activeId=data.id;}saveState();closeModal();render();toast(edit?'角色已更新':'角色已创建');};const del=$('#deleteAgent');if(del)del.onclick=()=>confirmDialog('删除角色','此操作会同时删除该角色的剧情记忆，无法恢复。','删除',()=>{state.agents=state.agents.filter(a=>a.id!==agent.id);delete state.chats[agent.id];delete state.play[agent.id];state.activeId=state.agents[0].id;saveState();closeModal();render();toast('角色已删除');});});
    }
    function confirmDialog(title,detail,ok,fn){openModal(`<h2>${title}</h2><p class="hint">${detail}</p><div class="modal-footer"><button class="btn ghost" id="cancel">取消</button><button class="btn danger" id="confirm">${ok}</button></div>`,()=>{$('#cancel').onclick=closeModal;$('#confirm').onclick=fn;});}

    function closeSide(){$('#sidebar').classList.remove('open');$('#overlay').classList.remove('show');}

    $('#addAgent').onclick=()=>openAgentEditor();
    $('#editAgent').onclick=()=>openAgentEditor(activeAgent());
    $('#openSettings').onclick=openSettings;
    $('#menuButton').onclick=()=>{$('#sidebar').classList.add('open');$('#overlay').classList.add('show');};
    $('#overlay').onclick=closeSide;
    $('#modalLayer').onclick=e=>{if(e.target===$('#modalLayer'))closeModal();};
    $('#restartChat').onclick=()=>{if(!chat().length)return toast('当前对话还没有消息');confirmDialog('重启对话','将清空「'+activeAgent().name+'」的全部对话记忆、状态与场景，此操作无法撤销。','清空对话',()=>{state.chats[state.activeId]=[];const p=play();p.roleState='';p.scene=activeAgent().initialScene||'';p.summary='';p._init=true;saveState();closeModal();render();toast('已重启对话');});};
    $('#clearAllMemory').onclick=()=>{const count=Object.values(state.chats).reduce((total,list)=>total+(Array.isArray(list)?list.length:0),0);if(!count)return toast('目前没有可清空的记忆');confirmDialog('清空全部记忆','将删除所有智能体的 '+count+' 条本地对话记录与状态。智能体和 API 设置会保留，此操作无法撤销。','全部清空',()=>{state.chats={};state.play={};saveState();closeModal();render();toast('已清空全部记忆与对话');});};
    $('#sendButton').onclick=()=>sendMessage($('#prompt').value);
    $('#prompt').addEventListener('input',autoResize);
    $('#prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();sendMessage(e.currentTarget.value);}});
    $('#memoryToggle').onchange=e=>{state.memory=e.target.checked;saveState();toast(state.memory?'已开启对话记忆':'已关闭对话记忆');};
    $('#attachFile').onclick=()=>$('#chatFileInput').click();
    $('#chatFileInput').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;if(file.size>256*1024){toast('附件不能超过 256 KB');e.target.value='';return;}try{const content=(await file.text()).trim();if(!content)throw new Error('文件为空');state.attachment={name:file.name,content:content.slice(0,120000)};renderAttachment();toast('已附加：'+file.name);$('#prompt').focus();}catch(err){toast('附件读取失败');}finally{e.target.value='';}};
    $('#removeAttachment').onclick=()=>{state.attachment=null;renderAttachment();};

    function setMode(mode){ if(mode===state.mode) return; state.mode=mode; saveState(); render(); closeSide(); }
    document.querySelectorAll('#modeSwitch .mode-btn').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
    document.getElementById('wbBackBtn').onclick = ()=> setMode('rp');

    loadState(); render();

</script>
</body>
</html>
