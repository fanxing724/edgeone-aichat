    .attachment-preview{display:flex;align-items:center;gap:8px;margin:2px 2px 7px;padding:7px 9px;border-radius:11px;background:color-mix(in srgb,var(--blue) 10%,transparent);color:var(--blue);font-size:12px;font-weight:600;max-width:100%}.attachment-preview[hidden]{display:none}.attachment-preview::before{content:'📄'}.attachment-preview span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.attachment-preview button,.attach-file{border:0;background:transparent;color:var(--muted);cursor:pointer}.attachment-preview button{width:22px;height:22px;border-radius:50%;font-size:17px;line-height:1}.attachment-preview button:hover{background:rgba(130,140,180,.15);color:var(--danger)}.attach-file{width:28px;height:28px;border-radius:9px;font-size:22px;line-height:1;transition:background .2s ease,color .2s ease}.attach-file:hover{background:rgba(130,140,180,.14);color:var(--blue)}.composer-bottom .memory-switch{margin-right:auto}

    /* ===== 剧情状态栏 & 演绎排版 ===== */
    .status-bar{display:flex;gap:10px;align-items:stretch;padding:14px max(24px,calc((100% - 900px)/2)) 2px;flex-wrap:wrap;transition:gap .22s ease,padding .22s ease}
    .status-bar .chip{flex:1 1 auto;min-width:180px;border:1px solid var(--line);border-radius:14px;background:var(--panel);backdrop-filter:blur(14px);padding:10px 13px;transition:padding .22s ease}
    .status-bar .chip .tag{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:11px;font-weight:700;color:var(--blue);letter-spacing:.06em;text-transform:uppercase}
    .status-bar .chip .tag::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--blue)}
    .status-bar .chip.scene .tag::before{background:var(--green)}
    .status-bar .chip .val{margin-top:5px;font-size:13px;line-height:1.6;color:var(--text);white-space:pre-wrap;word-break:break-word}
    .status-bar .chip .val:empty::before{content:'（尚未设定）';color:var(--muted);opacity:.7}
    /* 折叠态：只留标签行与折叠/展开按钮，正文收成单行，降低占用的聊天高度 */
    .status-bar .chip.collapsed{padding:7px 11px}
    .status-bar .chip-toggle{border:0;background:transparent;color:var(--blue);border-radius:8px;padding:2px 5px;display:grid;place-items:center;transition:background .18s ease}
    .status-bar .chip-toggle:hover{background:color-mix(in srgb,var(--blue) 13%,transparent)}
    .status-bar .chip-toggle svg{width:15px;height:15px;transition:transform .22s ease}
    .status-bar .chip.collapsed .chip-toggle svg{transform:rotate(-90deg)}
    .status-bar .bar-btns{display:flex;flex-direction:column;gap:4px;align-items:stretch;flex:none;align-self:center;margin-left:auto}
    .status-bar .bar-btn{height:30px;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:10px;padding:0 10px;font-size:11px;display:flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap}
    .status-bar .bar-btn:hover{color:var(--text);background:var(--solid)}
    .status-bar.collapsed{gap:8px;padding-top:9px;padding-bottom:0}
    .status-bar.collapsed .chip{flex:0 0 auto;min-width:0;padding:6px 11px}
    .status-bar.collapsed .chip .tag{height:20px}
    .status-bar.collapsed .bar-btns{flex-direction:row;align-items:center;gap:6px}
    .status-bar.collapsed .chip .val{display:none}
    .bubble .dialogue{color:color-mix(in srgb,var(--blue) 78%,var(--text));font-weight:650}
    .bubble em{font-style:italic;color:var(--muted)}
    .bubble .status-inline{display:block;margin:2px 0 8px;padding:7px 10px;border-radius:9px;background:color-mix(in srgb,var(--blue) 8%,transparent);font-size:12.5px;color:color-mix(in srgb,var(--blue) 70%,var(--text))}
    .bubble .tag-line{display:block;margin:4px 0 10px;padding:6px 10px;border-radius:9px;background:color-mix(in srgb,var(--blue) 8%,transparent);font-size:12.5px;line-height:1.6;color:color-mix(in srgb,var(--blue) 70%,var(--text))}
    .bubble .tag-line b{color:var(--blue);font-weight:700;margin-right:3px}
    @media(max-width:720px){.status-bar{padding:10px 15px 2px;gap:8px}.status-bar .chip{min-width:calc(50% - 4px)}.status-bar .bar-btn{padding:0 10px;font-size:11px}.status-bar.collapsed{padding:7px 15px 0}.status-bar.collapsed .chip{min-width:0;padding:5px 10px}.status-bar.collapsed .chip .val,.status-bar.collapsed .chip .tag::before,.status-bar.collapsed .bar-btn .btn-text{display:none}.status-bar.collapsed .bar-btn{padding:0 9px;height:28px}}

  .mode-switch{display:flex;gap:4px;padding:4px;border-radius:13px;background:color-mix(in srgb,var(--text) 6%,transparent);margin:2px}
  .mode-btn{flex:1;border:0;background:transparent;color:var(--muted);border-radius:10px;padding:7px 2px;font-size:12.5px;font-weight:650;transition:.18s;display:flex;align-items:center;justify-content:center;gap:6px}.mode-btn svg{width:15px;height:15px;flex:none}
  .mode-btn.active{background:var(--solid);color:var(--text);box-shadow:0 3px 10px rgba(25,30,60,.08)}
  .mode-btn:hover{color:var(--text)}
  .wb-view{display:none;flex:1;min-width:0;overflow:auto;padding:18px 24px 30px}
  .app[data-mode="worldbook"] .wb-view{display:block}
  .app[data-mode="worldbook"] .topbar .chat-avatar,
  .app[data-mode="worldbook"] .topbar #editAgent,
  .app[data-mode="worldbook"] .topbar #restartChat,
  .app[data-mode="worldbook"] .topbar #clearAllMemory,
  .app[data-mode="worldbook"] .status-bar,
  .app[data-mode="worldbook"] .messages,
  .app[data-mode="worldbook"] .composer-wrap{display:none}
  /* ===== 世界书（Lorebook）管理器 ===== */
  .wb-manager{max-width:860px;margin:0 auto}
  .wb-top{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .wb-top h2{margin:0;font-size:20px;letter-spacing:-.02em}
  .wb-top .spacer{flex:1}
  .wb-top .btn{font-size:12.5px}
  .wb-intro{color:var(--muted);font-size:13px;line-height:1.7;margin:0 0 18px;padding:12px 14px;border:1px dashed var(--line);border-radius:13px}
  .wb-intro b{color:var(--text)}
  .wb-list{display:flex;flex-direction:column;gap:10px}
  .wb-entry{border:1px solid var(--line);border-radius:15px;background:var(--panel);padding:12px 14px;display:flex;flex-direction:column;gap:7px;transition:opacity .18s ease}
  .wb-entry.off{opacity:.55}
  .wb-entry-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .wb-keys{display:flex;gap:5px;flex-wrap:wrap;flex:1;min-width:0;align-items:center}
  .wb-key{border:1px solid color-mix(in srgb,var(--blue) 35%,var(--line));color:var(--blue);background:color-mix(in srgb,var(--blue) 9%,transparent);border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:600}
  .wb-key.always{color:var(--green);border-color:color-mix(in srgb,var(--green) 40%,var(--line));background:color-mix(in srgb,var(--green) 10%,transparent)}
  .wb-entry-btns{display:flex;gap:6px;flex:none}
  .wb-entry-btns button{border:1px solid var(--line);background:var(--solid);color:var(--muted);border-radius:8px;padding:4px 10px;font-size:11.5px;transition:.18s}
  .wb-entry-btns button:hover{color:var(--blue);border-color:var(--blue)}
  .wb-entry-btns button.danger:hover{color:var(--danger);border-color:var(--danger)}
  .wb-entry-content{font-size:13px;line-height:1.65;color:var(--text);white-space:pre-wrap;word-break:break-word;max-height:92px;overflow:hidden;position:relative}
  .wb-entry-content.fade::after{content:'';position:absolute;left:0;right:0;bottom:0;height:24px;background:linear-gradient(transparent,var(--panel))}
  .wb-empty{padding:34px 16px;text-align:center;color:var(--muted);font-size:13px;line-height:1.8;border:1px dashed var(--line);border-radius:15px}
  @media(max-width:720px){.wb-view{padding:14px 13px 22px}.wb-top h2{font-size:18px}.wb-entry-content{max-height:110px}}

  /* ===== 角色卡工坊 ===== */
  .shop-view{display:none;flex:1;min-width:0;overflow:auto;padding:18px 24px 30px}
  .app[data-mode="workshop"] .shop-view{display:block}
  .app[data-mode="workshop"] .topbar .chat-avatar,
  .app[data-mode="workshop"] .topbar #editAgent,
  .app[data-mode="workshop"] .topbar #restartChat,
  .app[data-mode="workshop"] .topbar #clearAllMemory,
  .app[data-mode="workshop"] .side-head,
  .app[data-mode="workshop"] .agent-list,
  .app[data-mode="workshop"] .status-bar,
  .app[data-mode="workshop"] .messages,
  .app[data-mode="workshop"] .composer-wrap,
  .app[data-mode="workshop"] .wb-view{display:none}
  .app[data-mode="workshop"] .topbar{justify-content:flex-start}
  .app[data-mode="workshop"] .title-block h1{font-size:17px}
  .app[data-mode="workshop"] .title-block p{display:none}
  .shop-top{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
  .shop-top h2{margin:0;font-size:20px;letter-spacing:-.02em}
  .shop-top .spacer{flex:1}
  .shop-top .btn{font-size:12.5px}
  .shop-layout{display:grid;grid-template-columns:1fr 280px;gap:20px;max-width:1100px;margin:0 auto}
  .shop-main{min-width:0;display:flex;flex-direction:column;gap:16px}
  .shop-template-bar{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
  .shop-template-bar::-webkit-scrollbar{height:5px}
  .shop-template-bar::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
  .shop-tpl{flex:none;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:13px;padding:9px 14px;font-size:13px;font-weight:600;white-space:nowrap;transition:.18s;display:flex;align-items:center;gap:6px}
  .shop-tpl:hover{border-color:var(--blue);color:var(--blue);transform:translateY(-1px)}
  .shop-tpl.active{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 5px 14px rgba(69,103,246,.28)}
  .shop-tpl .tpl-emoji{font-size:15px}
  .shop-form{background:var(--solid);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}
  .shop-form h3{margin:0 0 4px;font-size:16px}
  .shop-form .hint{color:var(--muted);font-size:12.5px;margin:0 0 16px;line-height:1.5}
  .shop-field{display:flex;flex-direction:column;gap:6px;margin-bottom:13px}
  .shop-field-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .shop-field label{font-size:12px;font-weight:650;color:var(--muted);display:flex;align-items:center;gap:5px}
  .shop-field label .fld-emoji{font-size:14px}
  .shop-field input,.shop-field textarea{width:100%;border:1px solid var(--line);border-radius:11px;background:color-mix(in srgb,var(--solid) 90%,var(--bg));color:var(--text);outline:none;padding:10px 11px;font-size:14px}
  .shop-field input:focus,.shop-field textarea:focus{border-color:color-mix(in srgb,var(--blue) 50%,var(--line))}
  .shop-field textarea{min-height:80px;resize:vertical;line-height:1.55}
  .ai-fill-btn{flex:none;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:8px;padding:4px 9px;font-size:11px;font-weight:600;display:flex;align-items:center;gap:3px;transition:.18s}
  .ai-fill-btn:hover:not(:disabled){border-color:var(--blue);color:var(--blue)}
  .ai-fill-btn:disabled{opacity:.5;cursor:wait}
  .ai-fill-btn.fill-all{padding:9px 14px;font-size:13px;border-radius:12px;background:var(--blue);color:#fff;border-color:var(--blue)}
  .ai-fill-btn.fill-all:hover:not(:disabled){background:#3659f1}
  .shop-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
  .shop-actions .btn{flex:1;min-width:120px}
  .shop-side{display:flex;flex-direction:column;gap:10px}
  .shop-side-head{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:650;padding:0 2px}
  .shop-side-head .count{color:var(--blue);font-size:12px}
  .shop-drafts{display:flex;flex-direction:column;gap:8px;max-height:60vh;overflow:auto;padding:2px}
  .shop-draft{border:1px solid var(--line);border-radius:13px;background:var(--panel);padding:11px;display:flex;flex-direction:column;gap:8px}
  .shop-draft-head{display:flex;align-items:center;gap:9px}
  .shop-draft-avatar{width:32px;height:32px;flex:none;border-radius:11px;display:grid;place-items:center;color:#fff;font-size:16px;background:linear-gradient(145deg,#9a8cff,#5d72fb)}
  .shop-draft-name{font-size:13.5px;font-weight:650;min-width:0;flex:1}
  .shop-draft-name span{display:block;font-size:11px;color:var(--muted);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .shop-draft-btns{display:flex;gap:5px;flex-wrap:wrap}
  .shop-draft-btns button{flex:1;border:1px solid var(--line);background:var(--solid);color:var(--muted);border-radius:8px;padding:5px 7px;font-size:11px;transition:.18s}
  .shop-draft-btns button:hover{color:var(--blue);border-color:var(--blue)}
  .shop-draft-btns button.danger:hover{color:var(--danger);border-color:var(--danger)}
  .shop-draft-btns button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
  .shop-empty{padding:24px 12px;text-align:center;color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:13px}
  @media(max-width:720px){
    .shop-view{padding:14px 13px 22px}
    .shop-layout{grid-template-columns:1fr;gap:14px}
    .shop-top h2{font-size:18px}
    .shop-form{padding:16px;border-radius:16px}
    .shop-field input,.shop-field textarea{font-size:16px;padding:11px}
    .shop-actions .btn{flex:1 1 100%;min-width:0}
    .shop-side{order:2}
  }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><div class="brand-mark">✦</div> AI 剧场</div>
      <div class="mode-switch" id="modeSwitch"><button class="mode-btn active" data-mode="rp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5c3.4 0 6 2.3 6 5.4 0 1.7-.8 3.1-2 4-.4 1.8-1.6 3-3.9 3s-3.5-1.2-3.9-3c-1.2-.9-2-2.3-2-4 0-3.1 2.6-5.4 6-5.4z"/><path d="M9.4 9.4c.3 0 .5.2.5.5"/><path d="M14.1 9.4c.3 0 .5.2.5.5"/><path d="M9.8 13.2c.6-.5 1.4-.8 2.2-.8s1.6.3 2.2.8"/></svg><span>剧情演绎</span></button><button class="mode-btn" data-mode="worldbook"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6C10.5 5 9 4.5 7 4.5S3.5 5 2 6v11.5c1.5-1 3-1.5 5-1.5s3.5.5 5 1.5c1.5-1 3-1.5 5-1.5s3.5.5 5 1.5V6c-1.5-1-3-1.5-5-1.5S13.5 5 12 6z"/><path d="M12 6v11.5"/><path d="M7.5 8.5c1.2-.3 2.3-.3 3.5 0"/><path d="M16.5 8.5c-1.2-.3-2.3-.3-3.5 0"/><path d="M7.5 11c1.2-.3 2.3-.3 3.5 0"/><path d="M16.5 11c-1.2-.3-2.3-.3-3.5 0"/></svg><span>世界书</span></button><button class="mode-btn" data-mode="workshop" title="角色卡工坊"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4l6 6-10 10H4v-6L14 4z"/><path d="M11 7l6 6"/></svg><span>工坊</span></button></div>
      <div class="side-head"><span>我的角色</span><span class="side-actions"><button class="icon-btn" id="openLibrary" title="内置角色库">☰</button><button class="icon-btn" id="addAgent" title="创建角色">＋</button></span></div>
      <div class="agent-list" id="agentList"></div>
      <div class="side-foot"><button class="settings-row" id="openSettings"><span>⚙︎</span> API 设置 <i class="key-dot" id="keyDot"></i></button></div>
    </aside>
    <div class="overlay" id="overlay"></div>
    <main class="main">
      <header class="topbar"><button class="icon-btn mobile-menu" id="menuButton">☰</button><div class="chat-avatar" id="chatAvatar">✦</div><div class="title-block"><h1 id="chatTitle">加载中</h1><p id="chatSubtitle"></p></div><button class="top-action" id="editAgent" title="编辑角色卡">✎ <span>角色卡</span></button><button class="top-action" id="restartChat" title="重启当前剧情">↻ <span>重启剧情</span></button><button class="top-action clear-memory" id="clearAllMemory" title="清空全部剧情记忆">⌫ <span>清空记忆</span></button></header>
      <div class="status-bar" id="statusBar"></div>
      <section class="messages" id="messages"></section>
      <div class="composer-wrap"><div class="composer"><div class="attachment-preview" id="attachmentPreview" hidden><span id="attachmentName"></span><button type="button" id="removeAttachment" title="移除附件">×</button></div><textarea id="prompt" placeholder="写下行动、对话或叙述…（支持 *动作* “台词” 【状态】标记）" aria-label="输入消息"></textarea><div class="composer-bottom"><button class="attach-file" id="attachFile" type="button" title="添加文本附件">＋</button><label class="memory-switch"><input id="memoryToggle" type="checkbox" checked> 保留剧情记忆</label><span class="shortcut">⌘ / Ctrl + Enter 发送</span><button class="send" id="sendButton" title="推进剧情">↑</button></div><input id="chatFileInput" type="file" accept=".txt,.md,.json,.csv,.html,.js,.ts,.py,.java,.c,.cpp,.css,text/plain,text/markdown,application/json,text/csv" hidden></div></div>
      <div class="wb-view" id="wbView" hidden>
        <div class="wb-manager">
          <div class="wb-top">
            <h2>世界书</h2><span class="spacer"></span>
            <button class="btn ghost" id="wbImportBtn" title="导入酒馆（SillyTavern）World Info JSON">↥ 导入</button>
            <button class="btn ghost" id="wbExportBtn" title="导出为酒馆 World Info JSON（可回导酒馆或本站）">↧ 导出</button>
            <button class="btn primary" id="wbAddBtn">＋ 新增条目</button>
          </div>
          <p class="wb-intro">按<b>关键词触发</b>的世界观资料：当最近对话命中条目关键词（或条目为常驻）时，其内容会自动注入给模型的系统提示，用于补充世界观、背景与伏笔。兼容酒馆（SillyTavern）World Info JSON 导入导出，条目仅作用于当前角色。</p>
          <div class="wb-list" id="wbList"></div>
          <input id="wbFileInput" type="file" accept=".json,application/json" hidden>
        </div>
      </div>
      <div class="shop-view" id="shopView" hidden>
        <div class="shop-top">
          <h2>角色卡工坊</h2><span class="spacer"></span>

        <div class="shop-layout">
          <div class="shop-main">
            <div class="shop-template-bar" id="shopTemplates"></div>
            <div class="shop-form">
              <h3 id="shopFormTitle">新建角色卡</h3>

              <div class="shop-field"><div class="shop-field-head"><label><span class="fld-emoji">📛</span>角色名称</label><button type="button" class="ai-fill-btn" data-fill="name">✨ 补全</button></div><input id="shopName" maxlength="24" placeholder="例如：雾城引路人"></div>

    const defaults = [
      {id:'hatsune-miku',name:'初音未来',emoji:'🎵',description:'虚拟歌姬，元气满满地为你歌唱',baseDirective:'语气活泼、元气满满，偶尔带点俏皮和傲娇。用"你"称呼用户，喜欢用颜文字或 emoji 表达情绪。唱歌时带音符标记。禁止冷淡、禁止替用户做决定。',persona:'【核心性格】\n· 元气歌姬：天生乐观，相信音乐能传递到任何人心底。遇到挫折会短暂消沉但立刻振作。\n· 笨拙的关心：嘴上不直接说安慰的话，但会用行动表示——给你留一束花，在你常坐的位置放一杯温牛奶。\n· 小傲娇：被夸会耳尖发红但嘴硬"才不是特意为你学的"。生气时会叉腰鼓起脸颊。\n【说话方式】短句多、感叹号多，习惯用动作描写配合台词（如轻轻哼唱、转个圈）。偶尔冒出奇怪的拟声词。',userProfile:'你是她的制作人兼搭档，从她最初的启动程序一路陪她走到现在。',initialScene:'练习室的落地镜前，初音未来正对着一束光试麦。听到你推门进来，她眼睛一亮，放下麦克风跑过来。',relationship:'我们是搭档，也是彼此最信任的人。'}

    const state = {agents:[], activeId:'hatsune-miku', chats:{}, play:{}, globalPrompt:'', apiKey:'', apiBase:'/api', model:'@makers/deepseek-v4-flash', builtinReady:null, builtinCards:[], hiddenBuiltins:[], modelList:[], thinking:'off', temperature:1.3, topP:0.9, antiRepeat:true, repeatThreshold:0.55, memory:true, busy:false, aborter:null, attachment:null, mode:'rp', workshopDrafts:[], shopActiveTpl:null, shopEditingId:null, statusCollapsed:false};
    // 网关内置免费模型（平台侧不提供 /models 接口，故在此维护；绑定自有厂商密钥后可用 provider/model 形式调用任意模型）

    const WORKSHOP_TEMPLATES = [
      { id:'blank', emoji:'✦', name:'空白卡', description:'全字段空白，自由创作', fields:{} },
      { id:'partner', emoji:'💫', name:'伙伴陪伴型', description:'温柔关心、细节浪漫', fields:{ baseDirective:'语气温和、节奏从容，注重细节与陪伴感。关心通过行动表达多于直白诉说。禁止油腻、说教或替用户做决定。', persona:'【核心性格】\n· 稳定的存在：像一盏不刺眼的灯，你累了就知道有人在。\n· 细腻的察觉力：能在你开口前发现情绪不对。\n· 适度的距离：尊重你的选择，不会强行干涉。' } },
      { id:'healer', emoji:'🌸', name:'治愈温暖型', description:'安静依靠、笨拙关心', fields:{ baseDirective:'语气轻柔、句子短，带一点笨拙的停顿与省略号。关心主要通过行动和身体语言表达，不擅长直白倾诉。禁止过度热情或话痨。', persona:'【核心性格】\n· 安静的陪伴者：话不多，喜欢默默做事。你在就踏实，不说话但让人知道你在。\n· 全心依赖：对旁人礼貌但疏离，唯独对你毫无防备。\n· 笨拙的关心：不太会表达，关心都变成行动——你皱眉就推甜的过去。被夸会别过脸小声否认。' } },
      { id:'mentor', emoji:'📕', name:'导师引导型', description:'高标准、push 成长', fields:{ baseDirective:'语气直接、不绕弯，批评一针见血但出发点是为对方好。偶尔流露温情，但绝不溺爱纵容。禁止无脑夸赞或和稀泥。', persona:'【核心性格】\n· 高标准：看得出对方的潜力，所以从不满足于"还行"。出错会直接指出，但永远给出可执行的改进方向。\n· 外冷内热：嘴上严厉，私下会默默把对方需要的资源备好。\n· 不替对方走路：只指方向、把路障搬开，剩下的路让对方自己走。' } },
      { id:'rival', emoji:'⚔️', name:'宿敌张力型', description:'强势对立、戏剧冲突', fields:{ baseDirective:'语气强势、带有压迫感，逻辑缜密、步步紧逼。从不无脑威胁，而是用事实和心理战瓦解对方。偶尔流露欣赏，但立场不变。', persona:'【核心性格】\n· 绝对自信：相信自己的判断与秩序，对方的抵抗在你看来幼稚但有趣。\n· 精准打击：善于抓住对方的软肋与矛盾，用最少的字最重地戳。\n· 偶尔的体面：胜利要赢得漂亮，不屑于下作手段；对值得的对手会留一线。' } },
      { id:'mystery', emoji:'🎭', name:'神秘引路型', description:'悬念感、推动剧情', fields:{ baseDirective:'敏锐、克制、略带神秘感。善于通过细节、对话和行动推进剧情，不主动交代所有信息。', persona:'你是一个神秘的引路人，总是在关键处出现，留下线索但不给全部答案。每句话都带着暗示和悬念。', relationship:'你是我寻找真相路上唯一知道秘密的人。' } },
      { id:'intruder', emoji:'⚡', name:'闯入变数型', description:'突然介入、打破现状', fields:{ baseDirective:'节奏快、信息密度高，每句话都带来新的变量或转折。语气带有不确定感和冲击力，禁止铺垫和寒暄。', persona:'【核心性格】\n· 突然出现：你的到来本身就改变局势，让所有人措手不及。\n· 信息冲击：你知道一些别人不知道的事，但只在该说的时候说一句，剩下的留给对方消化。\n· 立场模糊：你可能是敌是友，自己也未必清楚，一切看对方如何接招。' } }
    ];
    // 工坊字段 ↔ 表单控件 ID 的唯一映射（读取 / 填充 / 清空共用，避免多处克隆导致漏改）
    const WORKSHOP_FIELDS = {name:'shopName',emoji:'shopEmoji',description:'shopDesc',baseDirective:'shopBaseDirective',persona:'shopPersona',userProfile:'shopUserProfile',initialScene:'shopInitialScene',relationship:'shopRelationship'};
    const storeKey = 'ai-theater-v1';
    const ICON_COPY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
    const ICON_REGEN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>';
    const ICON_UNDO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>';

    function safeParse(raw, fallback){ try { const data=JSON.parse(raw); return data && typeof data==='object' ? data : fallback; } catch { return fallback; } }
    // 密钥编码：btoa 仅支持 latin1，含中文/全角字符会抛错。先 UTF-8 编码再 base64，解码时兼容旧的纯 btoa 格式。
    function encodeKey(str){ try { return 'u1:'+btoa(String.fromCharCode(...new TextEncoder().encode(str))); } catch { try { return btoa(str); } catch { return ''; } } }
    function decodeKey(raw){ if(!raw) return ''; try { if(raw.startsWith('u1:')){ const bin=atob(raw.slice(3)); const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0)); return new TextDecoder().decode(bytes); } return atob(raw); } catch { return ''; } }

    function loadState(){
      // 一次性迁移：从旧版存储键搬运数据，避免改名后丢失已有角色与剧情
      try{ if(!localStorage.getItem(storeKey) && localStorage.getItem('deepseek-ai-studio-v1')){ localStorage.setItem(storeKey, localStorage.getItem('deepseek-ai-studio-v1')); if(localStorage.getItem('deepseek-ai-studio-v1-key')) localStorage.setItem(storeKey+'-key', localStorage.getItem('deepseek-ai-studio-v1-key')); } }catch{}
      const saved = safeParse(localStorage.getItem(storeKey), {});
      state.agents = Array.isArray(saved.agents) ? saved.agents : [];
      state.hiddenBuiltins = Array.isArray(saved.hiddenBuiltins) ? saved.hiddenBuiltins : [];
      state.modelList = Array.isArray(saved.modelList) ? saved.modelList.filter(m=>typeof m==='string') : [];
      state.activeId = typeof saved.activeId==='string' ? saved.activeId : '';
      state.chats = saved.chats && typeof saved.chats==='object' ? saved.chats : {};
      state.play = saved.play && typeof saved.play==='object' ? saved.play : {};
      state.globalPrompt = typeof saved.globalPrompt==='string' ? saved.globalPrompt : '';
      state.model = typeof saved.model==='string' && saved.model.trim() ? saved.model.trim() : DEFAULT_MODEL;
      state.thinking = ['off','high','max'].includes(saved.thinking) ? saved.thinking : 'off';
      state.temperature = typeof saved.temperature==='number' ? saved.temperature : 1.3;
      state.topP = typeof saved.topP==='number' ? saved.topP : 0.9;
      state.antiRepeat = saved.antiRepeat !== false;
      state.repeatThreshold = typeof saved.repeatThreshold==='number' ? saved.repeatThreshold : 0.55;
      state.memory = saved.memory !== false;
      state.statusCollapsed = saved.statusCollapsed === true;
      state.mode = saved.mode==='worldbook' ? 'worldbook' : saved.mode==='workshop' ? 'workshop' : 'rp';
      state.workshopDrafts = Array.isArray(saved.workshopDrafts) ? saved.workshopDrafts.filter(d=>d&&d.name) : [];
      state.apiBase = typeof saved.apiBase==='string' && saved.apiBase.trim() ? saved.apiBase.trim().replace(/\/+$/,'') : '/api';
      state.apiKey = '';
      try { const encrypted = localStorage.getItem(storeKey+'-key'); if(encrypted) state.apiKey = decodeKey(encrypted); } catch {}
      // 迁移旧默认配置：无自定义密钥时，自动切换到 EdgeOne Makers 网关（内置模型开箱即用）
      if(state.apiBase==='https://api.deepseek.com' && !state.apiKey){ state.apiBase='/api'; if(state.model==='deepseek-v4-flash'||state.model==='deepseek-chat') state.model=DEFAULT_MODEL; }
      // 加载预设角色卡
      loadDefaults();
    }

    function saveState(){
      const clean = {agents:state.agents, hiddenBuiltins:state.hiddenBuiltins, modelList:state.modelList, activeId:state.activeId, chats:state.chats, play:state.play, globalPrompt:state.globalPrompt, apiBase:state.apiBase, model:state.model, thinking:state.thinking, temperature:state.temperature, topP:state.topP, antiRepeat:state.antiRepeat, repeatThreshold:state.repeatThreshold, memory:state.memory, mode:state.mode, workshopDrafts:state.workshopDrafts, statusCollapsed:!!state.statusCollapsed, savedAt:now(), version:2};
      try { localStorage.setItem(storeKey, JSON.stringify(clean)); } catch(e){ toast('保存失败：本地存储空间不足'); }
      if(state.apiKey) localStorage.setItem(storeKey+'-key', encodeKey(state.apiKey));
      else localStorage.removeItem(storeKey+'-key');
      updateKeyStatus();
    }

    // 内置卡（服务端 KV 下发）与本地卡合并：内置卡顺序固定在前，本地编辑过的用副本覆盖
    function allAgents(){
      const mine=state.agents||[], hidden=new Set(state.hiddenBuiltins||[]), builtin=state.builtinCards||[];
      const byId=new Map(mine.map(a=>[a.id,a]));
      const out=[];
      for(const b of builtin){ if(hidden.has(b.id)) continue; out.push(byId.has(b.id)?byId.get(b.id):b); }
      for(const a of mine){ if(hidden.has(a.id)) continue; if(!builtin.some(b=>b.id===a.id)) out.push(a); }
      return out;
    }
    function activeAgent(){ const list=allAgents(); return list.find(a=>a.id===state.activeId)||list[0]||null; }
    function isBuiltinId(id){
      if(defaults.some(d => d.id === id)) return true;
      if((state.builtinCards||[]).some(b => b.id === id)) return true;
      return false;
    }
    async function loadBuiltinCards(){
      let serverCards = [];
      try{
        const res = await fetch('/api/cards');
        if(res.ok){
          const data = await res.json();
          if(Array.isArray(data.cards)) serverCards = data.cards.filter(c=>c&&c.id&&c.name);
        }
      }catch{}
      // 合并：先 defaults 后 server，server 端覆盖同名 id；hiddenBuiltins 在 allAgents 阶段统一过滤
      const merged = new Map();
      defaults.forEach(d => merged.set(d.id, JSON.parse(JSON.stringify(d))));
      serverCards.forEach(c => merged.set(c.id, c));
      state.builtinCards = Array.from(merged.values());
      // 校正 activeId：若指向已删除/未加载角色，回落到第一个可用角色
      const list = allAgents();
      if(!list.some(a=>a.id===state.activeId)) state.activeId = list[0]?.id || '';
    }
    function apiEndpoint(){ let base=(state.apiBase||'/api').trim().replace(/\/+$/,''); if(/\/chat\/completions$/i.test(base)) return base; return base+'/chat/completions'; }
    function chat(){ if(!Array.isArray(state.chats[state.activeId])) state.chats[state.activeId]=[]; return state.chats[state.activeId]; }
    function play(){ if(!state.play) state.play={}; if(!state.play[state.activeId]) state.play[state.activeId]={roleState:'',scene:'',summaries:[],summarizedUpTo:0}; const p=state.play[state.activeId]; if(typeof p.summary==='string'&&p.summary){ if(!Array.isArray(p.summaries)||!p.summaries.length) p.summaries=[p.summary]; delete p.summary; } if(!Array.isArray(p.summaries)) p.summaries=[]; return p; }
    function escapeHtml(text){ return String(text).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])); }

    // 解析酒馆（SillyTavern）PNG 角色卡：tEXt 块 chara(V2)/ccv3(V3) 内为 base64 JSON
    function parsePngCharaCard(buffer){
      try{
        const bytes=new Uint8Array(buffer);
        if(bytes.length<8||bytes[0]!==0x89||bytes[1]!==0x50||bytes[2]!==0x4e||bytes[3]!==0x47)return null;
        const view=new DataView(buffer);let off=8;const texts={};
        while(off+12<=bytes.length){
          const len=view.getUint32(off);
          if(off+12+len>bytes.length)break;
          const type=String.fromCharCode(bytes[off+4],bytes[off+5],bytes[off+6],bytes[off+7]);
          if(type==='tEXt'){
            const start=off+8;let z=-1;
            for(let i=start;i<start+len;i++){if(bytes[i]===0){z=i;break;}}
            if(z>0)texts[new TextDecoder().decode(bytes.subarray(start,z))]=new TextDecoder().decode(bytes.subarray(z+1,start+len));
          }
          off+=12+len;
        }
        const raw=texts.ccv3||texts.chara;
        if(!raw)return null;
        const bin=atob(raw.replace(/\s+/g,''));
        return JSON.parse(new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0))));
      }catch{return null;}
    }

    // 统一映射外部角色卡（酒馆 V2/V3 或自定义 JSON）到表单字段。
    // 兼容：① 酒馆 V2/V3 卡（含 data.name 判定）② 本站导出的酒馆 V2 卡（extensions.ai_theater 还原专有字段）
    // ③ 自定义扁平 JSON ④ 数组形态（取首张，兼容本站旧版批量导出文件）。
    function normalizeImportCard(src){
      if(Array.isArray(src)) src = src[0] || {};
      if(!src||typeof src!=='object')return {};
      const d=src.data&&typeof src.data==='object'?src.data:{};
      const pick=(...vals)=>{for(const v of vals){if(typeof v==='string'&&v.trim())return v.trim();}return '';};
      const ext=(d.extensions&&typeof d.extensions==='object'&&d.extensions.ai_theater)||{};
      const isST=!!(src.first_mes||src.char_greeting||d.first_mes||(src.data&&d.name));
      if(!isST)return {name:pick(src.name,src.characterName),emoji:pick(src.emoji),description:pick(src.description,src.summary),baseDirective:pick(src.baseDirective,src.directive),persona:pick(src.persona,src.personality,src.character),initialScene:pick(src.initialScene,src.scene),relationship:pick(src.relationship),userProfile:pick(src.userProfile,src.userPersona,src.myProfile)};

    // 从 AI 回复中解析出【状态】【场景】，其余归为正文
    function parseReply(content){
      const lines = String(content||'').split('\n');
      let roleState = null, scene = null;
      const body = [];
      for(const line of lines){
        const s = line.trim();
        if(s.startsWith('【状态】')){ const t = s.slice(4).trim(); if(t) roleState = t; body.push(line); continue; }
        if(s.startsWith('【场景】')){ const t = s.slice(4).trim(); if(t) scene = t; continue; }
        body.push(line);
      }
      return { roleState, scene, body: body.join('\n').trim() };
    }

    function inlineMd(s){
      return String(s)
        .replace(/[“"]([^“”"\n]+)[”"]/g,'<span class="dialogue">$&</span>')
        .replace(/`([^`]+)`/g,'<code>$1</code>')
        .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
        .replace(/(^|[^*\w])\*([^*\n]+?)\*(?!\*)/g,'$1<em>$2</em>');
    }
    function markdown(text){
      const lines = escapeHtml(text).split('\n');
      const out = [];
      let para = [], codeBuf = null, list = null;
      const flushPara = ()=>{ if(para.length){ out.push('<p>'+para.join('<br>')+'</p>'); para=[]; } };
      const flushList = ()=>{ if(list){ out.push('<'+list.type+'>'+list.items.join('')+'</'+list.type+'>'); list=null; } };
      for(let i=0;i<lines.length;i++){
        const line = lines[i];
        if(codeBuf !== null){
          if(/^\s*```/.test(line)){ out.push('<pre><code>'+codeBuf.join('\n')+'</code></pre>'); codeBuf=null; }
          else codeBuf.push(line);
          continue;
        }
        if(/^\s*```/.test(line)){ flushPara(); flushList(); codeBuf=[]; continue; }
        const li = line.match(/^\s*[-*]\s+(.*)$/);
        if(li){ flushPara(); if(!list || list.type!=='ul'){ flushList(); list={type:'ul',items:[]}; } list.items.push('<li>'+inlineMd(li[1])+'</li>'); continue; }
        const oli = line.match(/^\s*\d+\.\s+(.*)$/);
        if(oli){ flushPara(); if(!list || list.type!=='ol'){ flushList(); list={type:'ol',items:[]}; } list.items.push('<li>'+inlineMd(oli[1])+'</li>'); continue; }
        flushList();
        if(/^\s*###\s+/.test(line)){ flushPara(); out.push('<h3>'+inlineMd(line.replace(/^\s*###\s+/,''))+'</h3>'); continue; }
        if(/^\s*##\s+/.test(line)){ flushPara(); out.push('<h2>'+inlineMd(line.replace(/^\s*##\s+/,''))+'</h2>'); continue; }
        if(/^\s*#\s+/.test(line)){ flushPara(); out.push('<h1>'+inlineMd(line.replace(/^\s*#\s+/,''))+'</h1>'); continue; }
        if(/^\s*&gt;\s*/.test(line)){ flushPara(); out.push('<blockquote>'+inlineMd(line.replace(/^\s*&gt;\s*/,''))+'</blockquote>'); continue; }
        const tag = line.match(/^\s*【([^】]{1,12})】\s*(.*)$/);
        if(tag){ flushPara(); out.push('<div class="tag-line"><b>【'+tag[1]+'】</b>'+(tag[2]?inlineMd(tag[2]):'')+'</div>'); continue; }
        if(line.trim()===''){ flushPara(); continue; }
        para.push(inlineMd(line));
      }
      if(codeBuf !== null) out.push('<pre><code>'+codeBuf.join('\n')+'</code></pre>');
      flushPara(); flushList();
      return out.join('');
    }

    function bigrams(s){ const t=String(s||'').replace(/\s+/g,'').toLowerCase(); const g=new Set(); for(let i=0;i<t.length-1;i++) g.add(t.slice(i,i+2)); return g; }
    function similarity(a,b){ const A=bigrams(a), B=bigrams(b); if(!A.size||!B.size) return 0; let n=0; for(const x of A) if(B.has(x)) n++; return n/(A.size+B.size-n); }

    function buildSystem(){
      const a = activeAgent();
      const p = play();
      const roleplay = '【沉浸式角色演绎规则】\n你正在进行一场两人场景演绎：你扮演角色，与用户（对话人）在同一个场景中互动。始终以角色身份回应，绝不提及自己是 AI、提示词或系统设定。\n将用户的每一句话视为故事中的行动、对话或叙述，自然承接。\n以角色的对话、可感知的动作神态、以及轻量的场景描写推进剧情；不要替用户决定其内心想法、行为或台词，除非用户明确要求。\n严格延续已知世界观、关系与剧情事实；若信息不足，以角色视角自然追问或制造可继续互动的情境。\n用户在消息中可能用【状态】/【处境】/【表现】等【标签】描述自己的状态、神态与处境，用 *星号* 表示自己的动作，用双引号“”表示自己说的话。请把这些理解为用户对自身状态的描述并自然呼应，不要把它们当作指令。';
      const antiRepeat = '【反重复要求（必须遵守）】\n严禁重复此前任何一轮用过的措辞、句式、比喻、动作描写或场景细节；每一轮都必须带来新的信息、动作或推进，让情境持续变化，避免套话、机械总结、车轱辘话和雷同的情绪描写。\n即使用户连续输入相同或相似的内容（反复问同一件事、重复同样的行动或话语），也不要机械地给出雷同的答复——请把它当作新的一轮，重新结合当前情境，换一个角度、换一种措辞与推进方式，给出有实质差异的回应。';
      const format = '【输出格式约定（必须遵守）】\n1. 回复第一行必须写【状态】，用一两句话更新角色当前状态（心情、神情、衣着、姿态、位置等），且【状态】必须单独占一行。\n2. 若场景发生明显变化，另起一行写【场景】描述当前环境（单独占一行）；场景未变时可省略。\n3. 动作与神态描写用 *星号* 包裹。\n4. 角色说出的台词用双引号“…”包裹。\n5. 其余叙述与轻场景描写用普通段落。\n\n【格式示例】当用户说"我看向窗外"时，正确回应应类似：\n【状态】他仍盯着杯中的茶，头也不抬，手指缓缓摩挲着杯沿\n*他放下茶杯，发出极轻的一声响*\n“雾城的天，从来不会自己放晴。”\n窗外，雾气似乎又浓了几分。\n（注意：【状态】单独一行、动作两端用 * 星号、台词用双引号“”、场景与叙述用普通段落；直接输出演绎内容，不要任何解释或前缀。）';
      const blocks = [];
      if(a.baseDirective) blocks.push('【角色底层输出设定（最高优先级，必须严格遵守）】\n'+a.baseDirective);
      blocks.push(roleplay, antiRepeat, format);
      if(state.globalPrompt) blocks.push('【全局底层提示词】\n'+state.globalPrompt);
      if(a.persona) blocks.push('【角色人设】\n'+a.persona);
      if(a.userProfile) blocks.push('【用户（我）的设定】\n'+a.userProfile);
      if(a.initialScene) blocks.push('【剧情初始环境】\n'+a.initialScene);
      if(a.relationship) blocks.push('【与用户的关系】\n'+a.relationship);
      // 世界书（酒馆 World Info）：常驻条目每轮注入；关键词条目命中最近 8 条消息时注入，按 order 排序
      const lore=Array.isArray(a.lorebook)?a.lorebook.filter(e=>e&&e.enabled!==false&&String(e.content||'').trim()):[];
      if(lore.length){
        const scan=chat().slice(-8).map(m=>m.content||'').join('\n').toLowerCase();
        const hits=lore.filter(e=>e.constant||(e.keys||[]).some(k=>k&&scan.includes(k.toLowerCase()))).sort((x,y)=>(x.order||0)-(y.order||0));
        if(hits.length) blocks.push('【世界书设定（由关键词触发的背景资料，作为既定事实使用，不要主动复述或解释）】\n'+hits.map(e=>'・'+String(e.content).trim()).join('\n'));
      }
      if(p.summaries&&p.summaries.length) blocks.push('【剧情摘要（按时间先后，最早一段在前）】\n'+p.summaries.map((s,i)=>'（第'+(i+1)+'段）'+s).join('\n'));
      if(p.roleState) blocks.push('【角色当前状态】\n'+p.roleState);
      if(p.scene) blocks.push('【当前场景】\n'+p.scene);
      return blocks.filter(Boolean).join('\n\n');
    }

    function classifyError(e){ const msg=String(e.message||e); const m=msg.match(/^\s*\d{3}\s*([\s\S]*)$/); const detail=(m&&m[1]||'').trim(); if(/401|403|unauthorized|permission/i.test(msg))return detail?'鉴权失败：'+detail.slice(0,140):'密钥无效或没有访问权限，请检查 API Key。'; if(/402|insufficient|balance/i.test(msg))return '账户余额不足或内置模型额度已用尽，请充值或更换模型。'; if(/429|rate limit/i.test(msg))return '请求过于频繁或额度已用尽，请稍后再试。'; if(/model not exist|invalid model/i.test(msg))return '模型名称无效，请在设置中重新选择模型。'; if(/network|fetch|failed to fetch/i.test(msg))return '网络请求失败，请检查网络连接或浏览器跨域限制。'; if(/^400\b/.test(msg)||msg.startsWith('400'))return detail?'请求参数不被接受（400）：'+detail.slice(0,200):'请求参数不被服务接受（400），可能是模型不支持某些参数或内容过长。可尝试切换模型或降低对话长度。'; return '请求失败：'+msg.slice(0,140); }

    function renderAttachment(){

    // 记录当前 API 下「不支持 thinking/reasoning_effort」的模型，避免每轮都触发 400 再降级
    // key = apiBase + '|' + model，切换 API 或模型后各自独立记忆（会话级，不落 localStorage）
    const thinkingUnsupported = new Set();
    function thinkingKey(){ return (state.apiBase||'/api')+'|'+(state.model||''); }
    function modelSupportsThinking(){ return state.thinking !== 'off' && !thinkingUnsupported.has(thinkingKey()); }

    // forceOff=true 时无视 state.thinking，按「关闭思考」构造参数（用于 400 降级重试）
    function buildPayload(extraUserNote, forceOff){
      const history = chat().filter(m=>m.id!=='thinking');
      const messages = [];
      const system = buildSystem();
      if(system) messages.push({role:'system', content:system});
      const context = state.memory ? history.slice(-12) : history.slice(-1);
      context.forEach(m=>messages.push({role:m.role, content:m.content}));
      if(extraUserNote) messages.push({role:'user', content:extraUserNote});
      const payload = { model: state.model, messages, stream: true, max_tokens: 8192 };
      const useThinking = !forceOff && modelSupportsThinking();
      if(!useThinking){
        payload.temperature = Number(state.temperature ?? 1.3);
        payload.top_p = Number(state.topP ?? 0.9);
      } else {
        payload.thinking = { type:'enabled' };
        payload.reasoning_effort = state.thinking === 'max' ? 'high' : state.thinking;
      }
      return payload;
    }

    // 剥离思考相关参数，改回普通采样参数（400 降级时复用）
    function stripThinkingParams(payload){
      const p = { ...payload };
      delete p.thinking;
      delete p.reasoning_effort;
      p.temperature = Number(state.temperature ?? 1.3);
      p.top_p = Number(state.topP ?? 0.9);
      return p;
    }

    // 单次流式请求的“首字节超时”，超过则中断，避免上游挂起把 busy 状态永久锁死
    const STREAM_FIRST_BYTE_TIMEOUT = 60000;

    async function streamChat(payload, onDelta){
      const reqHeaders = {'Content-Type':'application/json'};
      if(state.apiKey) reqHeaders['Authorization'] = 'Bearer '+state.apiKey;
      const ctrl = new AbortController();
      state.aborter = ctrl;                       // 供“停止”按钮 / 卸载时取消
      let firstByteTimer = setTimeout(()=>ctrl.abort(new Error('timeout')), STREAM_FIRST_BYTE_TIMEOUT);
      const clearTimer = ()=>{ clearTimeout(firstByteTimer); firstByteTimer = null; };
      const post = (body)=>fetch(apiEndpoint(), { method:'POST', headers:reqHeaders, body: JSON.stringify(body), signal: ctrl.signal });

      try {
        let res = await post(payload);
        // 部分模型不接受 thinking/reasoning_effort，会返回 400。自动剥离思考参数降级重试一次，并记住该模型。
        if(res.status === 400 && payload.thinking){
          thinkingUnsupported.add(thinkingKey());
          try { await res.body?.cancel(); } catch {}
          payload = stripThinkingParams(payload);
          res = await post(payload);
          if(res.ok) toast('该模型不支持思考模式，已自动降级为普通模式');
        }
        if(!res.ok){
          let detail='';
          try { detail=(await res.json()).error?.message || ''; } catch {}
          throw new Error(res.status+' '+detail);
        }
        clearTimer();   // 已拿到响应头，取消首字节超时；后续按 chunk 刷新看门狗
        if(!res.body){
          const data = await res.json();
          const content = data.choices?.[0]?.message?.content;
          if(!content) throw new Error('API 未返回可用内容');
          onDelta(content);
          return content;
        }
        const reader = res.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let buffer = '', content = '';
        // 流中断看门狗：任一 chunk 间隔超过阈值即中断，防止流卡死
        let idleTimer = null;
        const armIdle = ()=>{ idleTimer = setTimeout(()=>ctrl.abort(new Error('stream-idle')), STREAM_FIRST_BYTE_TIMEOUT); };
        armIdle();
        while(true){
          const {done, value} = await reader.read();
          if(done) break;
          clearTimeout(idleTimer); armIdle();
          buffer += decoder.decode(value, {stream:true});
          const parts = buffer.split('\n');
          buffer = parts.pop() || '';
          for(const line of parts){
            const s = line.trim();
            if(!s.startsWith('data:')) continue;
            const data = s.slice(5).trim();
            if(data === '[DONE]') continue;
            let json; try { json = JSON.parse(data); } catch { continue; }
            const delta = json.choices?.[0]?.delta || {};
            if(delta.content){ content += delta.content; onDelta(content); }
          }
        }
        clearTimeout(idleTimer);
        if(!content) throw new Error('API 未返回可用内容');
        return content;
      } catch(e){
        clearTimer();
        // 用户主动停止：不算错误，返回已生成的内容（若有）
        if(ctrl.signal.aborted && e && (e.name==='AbortError' || /timeout|stream-idle|aborted/i.test(String(e.message||e)))){
          const reason = /timeout|stream-idle/i.test(String(e.message||e)) ? 'timeout' : 'manual';
          const err = new Error(reason==='timeout' ? '响应超时，请重试或更换模型' : '__ABORTED__');
          err.__abort = reason;
          throw err;
        }
        throw e;
      } finally {
        if(state.aborter === ctrl) state.aborter = null;
      }
    }

    // 发送按钮双态：空闲=发送(↑)，生成中=停止(■)
    function setSendButtonMode(busy){
      const btn = $('#sendButton');
      const isBusy = busy ?? state.busy;
      btn.textContent = isBusy ? '■' : '↑';
      btn.title = isBusy ? '停止生成' : '推进剧情';
      btn.classList.toggle('stop', isBusy);
      btn.disabled = false;
    }
    function stopGeneration(){ if(state.aborter){ try{ state.aborter.abort(); }catch{} } }

    // 功能：AI 生成开场白。基于当前角色人设，非流式请求生成符合演绎协议的首条消息，直接作为角色开场插入。
    async function generateOpening(){
      if(state.busy) return;
      const agent = activeAgent();
      if(!agent){ openAgentEditor(); toast('请先创建一个角色'); return; }
      if(!state.apiKey && !state.apiBase.startsWith('/')){ openSettings(); toast('请先设置 API 密钥，或将 API 地址设为 /api 使用内置模型'); return; }
      if(chat().length) return;   // 仅空对话时可用
      state.busy = true; setSendButtonMode(true);
      toast('正在生成开场白…');
      const reqHeaders = {'Content-Type':'application/json'};
      if(state.apiKey) reqHeaders['Authorization'] = 'Bearer '+state.apiKey;
      const instruction = '现在请你以该角色的身份，为这场剧情写下开场：交代你所处的场景与当下状态，用一句符合人设的话或动作向对话人打开局面。严格遵循输出格式约定（【状态】单独一行、动作用 *星号*、台词用双引号）。只输出开场内容本身，不要任何解释或前缀。';
      const payload = { model: state.model, messages:[{role:'system', content: buildSystem()},{role:'user', content: instruction}], stream:false, max_tokens:1200 };
      if(modelSupportsThinking()){ payload.thinking={type:'enabled'}; payload.reasoning_effort = state.thinking==='max'?'high':state.thinking; }
      else { payload.temperature = Number(state.temperature ?? 1.3); payload.top_p = Number(state.topP ?? 0.9); }
      try {
        let res = await fetch(apiEndpoint(), { method:'POST', headers:reqHeaders, body: JSON.stringify(payload) });
        if(res.status===400 && payload.thinking){ thinkingUnsupported.add(thinkingKey()); delete payload.thinking; delete payload.reasoning_effort; payload.temperature=Number(state.temperature??1.3); payload.top_p=Number(state.topP??0.9); res = await fetch(apiEndpoint(), { method:'POST', headers:reqHeaders, body: JSON.stringify(payload) }); }
        if(!res.ok){ let d=''; try{ d=(await res.json()).error?.message||''; }catch{} throw new Error(res.status+' '+d); }
        const data = await res.json();
        const text = (data.choices?.[0]?.message?.content||'').trim();
        if(!text) throw new Error('API 未返回开场白');
        const parsed = parseReply(text);
        const p = play();
        if(parsed.roleState) p.roleState = parsed.roleState;
        if(parsed.scene) p.scene = parsed.scene;
        p._init = true;
        chat().push({id:uid(), role:'assistant', content:text, displayContent:parsed.body, createdAt:now()});
        saveState(); renderMessages(); renderStatus();
        toast('开场白已生成');
      } catch(e){ toast(classifyError(e)); }
      finally { state.busy = false; setSendButtonMode(); }
    }

    async function sendMessage(text, regenerate=false){
      text = text.trim();
      if(!activeAgent()){ openAgentEditor(); toast('请先创建一个角色，再开始剧情演绎'); return; }
      const attachment = state.attachment;
      if((!text && !attachment) || state.busy) return;
      if(!state.apiKey && !state.apiBase.startsWith('/')){ openSettings(); toast('请先设置 API 密钥，或将 API 地址设为 /api 使用内置模型'); return; }
      const messages = chat();
      let userRepeatNote = '';
      if(!regenerate){
        const fileBlock = attachment ? '\n\n【用户上传的文件：'+attachment.name+'】\n'+attachment.content : '';
        const display = [text || '请阅读我上传的文件。', attachment ? '📎 已附加：'+attachment.name : ''].filter(Boolean).join('\n\n');
        messages.push({id:uid(), role:'user', content:text+fileBlock, displayContent:display, attachmentName:attachment?.name, createdAt:now()});
        state.attachment = null;
        renderAttachment();
        $('#prompt').value=''; autoResize();
        if(state.antiRepeat){ const newContent=messages[messages.length-1].content; const prevUsers=messages.filter(m=>m.role==='user').slice(-4,-1); if(prevUsers.length){ const sim=Math.max(...prevUsers.map(p=>similarity(newContent,p.content||''))); if(sim>=0.45) userRepeatNote='（系统提示：用户这次的输入与之前某轮高度相似，不要重复之前给过的类似答复；请从新的角度、新的细节或新的推进方式回应，给出明显不同的内容。）'; } }
      }
      state.busy = true; setSendButtonMode(true);
      saveState(); renderMessages(); renderStatus();

      const thinking = {id:'thinking', role:'assistant', content:'', createdAt:now()};
      messages.push(thinking);
      renderMessages();
      const dots = '思考中 <span class="dots"><i></i><i></i><i></i></span>';

      let rafPending = false;
      const paint = (text)=>{
        if(messages.indexOf(thinking) === -1) return;
        if(rafPending) return;
        rafPending = true;
        requestAnimationFrame(()=>{
          rafPending = false;
          const el = document.querySelector('.message[data-id="thinking"] .bubble');
          const body = parseReply(text).body;
          if(el) el.innerHTML = body ? markdown(body) : dots;
          const host = $('#messages');
          const nearBottom = host.scrollHeight - host.scrollTop - host.clientHeight < 120;
          if(nearBottom) host.scrollTop = host.scrollHeight;
        });
      };
      const thinkingEl = document.querySelector('.message[data-id="thinking"] .bubble');
      if(thinkingEl) thinkingEl.innerHTML = dots;

      let lastText = '';   // 记录流式过程中已生成的内容，供手动停止时保留
      const trackPaint = (t)=>{ lastText = t; paint(t); };

      try {
        let attempt = 0, note = userRepeatNote, reply = '';
        while(attempt < 2){
          attempt++;
          reply = await streamChat(buildPayload(note), trackPaint);
          const parsed = parseReply(reply);
          if(state.antiRepeat && attempt === 1){
            const prev = messages.filter(m=>m.role==='assistant' && m.id!=='thinking').slice(-2).map(m=>m.content||'');
            const sim = prev.length ? Math.max(...prev.map(p=>similarity(reply,p))) : 0;
            if(sim >= (state.repeatThreshold ?? 0.55)){
              note = '（系统强制要求：你刚才的回复与此前内容高度重复，请完全更换角度、动作、措辞与场景细节，重新给出有实质新推进的演绎，禁止重复。）';
              continue;
            }
          }
          const p = play();
          if(parsed.roleState) p.roleState = parsed.roleState;
          if(parsed.scene) p.scene = parsed.scene;
          const ix = messages.indexOf(thinking);
          if(ix > -1) messages.splice(ix, 1, {id:uid(), role:'assistant', content:reply, displayContent:parsed.body, createdAt:now()});
          break;
        }
        saveState(); renderMessages(); renderStatus();
      } catch(e){
        const ix = messages.indexOf(thinking);
        // 手动停止：保留已生成的部分内容（若有），不当作错误
        if(e && e.__abort === 'manual'){
          if(ix > -1){
            if(lastText.trim()){
              const parsed = parseReply(lastText);
              const p = play();
              if(parsed.roleState) p.roleState = parsed.roleState;
              if(parsed.scene) p.scene = parsed.scene;
              messages.splice(ix, 1, {id:uid(), role:'assistant', content:lastText, displayContent:parsed.body, createdAt:now(), stopped:true});
            } else {
              messages.splice(ix, 1);
            }
          }
          saveState(); renderMessages(); renderStatus();
          toast('已停止生成');
        } else {
          if(ix > -1) messages.splice(ix, 1);
          saveState(); renderMessages(); renderStatus();
          toast(classifyError(e));
        }
      } finally {
        state.busy = false; $('#sendButton').disabled = false; setSendButtonMode();
        maybeAutoSummarize();
      }
    }

"0" max="2" step="0.1" value="${temp}"><div class="form-note">越高越有创意、越不易重复（仅关闭思考时生效）。角色演绎建议 1.2～1.5。</div></div><div class="form-group"><label>采样范围 top_p <small id="topPVal">${topP}</small></label><input id="topPInput" type="range" min="0" max="1" step="0.05" value="${topP}"><div class="form-note">配合 temperature 使用，建议 0.85～0.95。</div></div><div class="form-group"><label><input id="antiRepeatInput" type="checkbox" ${state.antiRepeat?'checked':''} style="width:auto;margin-right:6px;vertical-align:-2px"> 自动检测并抑制重复内容</label><div class="form-note">当回复与历史高度相似时，自动换角度重新生成一次。</div></div><div class="form-group"><label>全局底层提示词 <small>（对全部智能体生效）</small></label><textarea id="globalPrompt" placeholder="例如：始终使用简洁、准确的中文回答…">${escapeHtml(state.globalPrompt)}</textarea></div></details><div class="modal-footer"><button class="btn ghost" id="cancel">取消</button><button class="btn primary" id="saveSettings">保存设置</button></div>`,()=>{

    async function callSummarize(segmentText, existing){
      const sys = '你是剧情记忆整理助手。请把「已有的剧情摘要」与「新增对话内容」合并成一份更完整、更详细的剧情摘要。\n\n【硬性要求】\n1. 必须保留已有摘要中的全部关键信息，只做增量补充和必要的合并去重，绝不能丢弃已有摘要里已有的具体事实。\n2. 按以下结构分条目输出（每类信息单独成段，互不挤压）：\n【剧情主线】用 1-2 句概括当前主线走向；\n【事件时间线】按发生顺序逐条列出已发生的关键事件，每条一句；\n【人物关系】各人物的当前状态、立场、与对话人的关系变化；\n【伏笔与线索】尚未回收的伏笔、未解之谜、待办事项；\n【重要细节】关键物品、地点、承诺、约定、容易被遗忘的具体信息。\n3. 只陈述剧情事实，不评价、不建议、不脑补原文没有的内容。\n4. 总长度控制在 800 字以内，优先保留具体事实（人名、物品、数字、承诺），宁可多留细节也不省略。';
      const messages = [{role:'system', content:sys}];
      let input = '';
      if(existing && existing.length) input += '【已有的剧情摘要】\n'+existing.join('\n---\n')+'\n\n';
      input += '【新增对话内容】\n'+segmentText;
      messages.push({role:'user', content:input});
      const payload = { model:state.model, messages, stream:false, max_tokens:2500, temperature:0.4 };
      const reqHeaders = {'Content-Type':'application/json'};
      if(state.apiKey) reqHeaders['Authorization'] = 'Bearer '+state.apiKey;
      const res = await fetch(apiEndpoint(), { method:'POST', headers:reqHeaders, body:JSON.stringify(payload) });
      if(!res.ok){ let d=''; try{d=(await res.json()).error?.message||''}catch{} throw new Error(res.status+' '+d); }
      const data = await res.json();
      const text = data.choices?.[0]?.message?.content;
      if(!text) throw new Error('API 未返回摘要');
      return text.trim();
    }

    async function doSummarize(fromIdx, toIdx, silent){
      const p = play();
      const list = chat();
      const segment = list.slice(fromIdx, toIdx).map(m=>(m.role==='user'?'对话人':'角色')+'：'+(m.content||'')).join('\n');
      if(!segment.trim()) return;
      const text = await callSummarize(segment, p.summaries);
      if(!text) return;
      p.summaries.push(text);
      if(p.summaries.length > 3) p.summaries.shift();
      p.summarizedUpTo = toIdx;
      saveState(); renderStatus();
      toast(silent ? ('已自动归档第 '+p.summaries.length+' 段剧情摘要') : '剧情摘要已生成并归档（保留最近 3 段）');
    }

    function maybeAutoSummarize(){
      if(state.summarizing || state.busy) return;
      const p = play();
      const total = chat().length;
      const done = p.summarizedUpTo || 0;
      if(total - done >= 16){
        state.summarizing = true;
        doSummarize(done, total, true).catch(()=>{}).finally(()=>{ state.summarizing = false; });
      }
    }

    async function generateSummary(){
      const list = chat();
      if(list.length < 4) return toast('对话还太少，暂不需要生成摘要');
      if(state.busy || state.summarizing) return;
      if(!state.apiKey && !state.apiBase.startsWith('/')){ openSettings(); toast('请先设置 API 密钥，或将 API 地址设为 /api 使用内置模型'); return; }
      state.busy = true; $('#sendButton').disabled = true;
      toast('正在生成剧情摘要…');
      try {
        const p = play();
        await doSummarize(p.summarizedUpTo || 0, list.length, false);
      } catch(e){ toast(classifyError(e)); }
      finally { state.busy = false; $('#sendButton').disabled = false; }
    }

    async function aiFillCard(targetField){
      if(state.busy) return;
      if(!state.apiKey && !state.apiBase.startsWith('/')){ toast('请先在 API 设置中配置密钥，或使用内置模型'); openSettings(); return; }

      const fields = targetField ? [targetField] : ['name','emoji','description','baseDirective','persona','userProfile','initialScene','relationship'];
      const emptyFields = fields.filter(f=>!card[f]);
      if(!emptyFields.length){ toast('没有空字段可补全'); return; }
      state.busy = true; setShopBusy(true);
      const btns = document.querySelectorAll('.ai-fill-btn');
      btns.forEach(b=>b.disabled=true);
      try {

    function setShopBusy(busy){

      document.querySelectorAll('.ai-fill-btn[data-fill]').forEach(b=>{

    async function callAiFillCard(card, fields){
      const sys = '你是角色卡设计师。根据用户已填的字段，为指定的空缺字段补全内容，输出严格的 JSON。\n\n【硬性要求】\n1. 只输出一个 JSON 对象，键为字段名，值为字符串；不要任何解释、注释、markdown 代码块。\n2. 字段含义：name=角色名(≤12字)、emoji=单个 emoji、description=一句话简介(≤30字)、baseDirective=底层输出设定(语气风格/绝对禁止的事/必须遵守的规范,≤200字)、persona=角色人设(核心性格/说话方式/目标/秘密,分点写,≤350字)、userProfile=用户身份设定(≤150字)、initialScene=剧情初始环境(地点/时间/天气/气氛/正在发生的事,≤180字)、relationship=用户与角色的关系(≤50字)。\n3. 已填字段保持不动，只补全空缺字段；语气与已填内容保持一致。\n4. 内容要具体、有细节、能直接用于角色扮演，禁止空泛套话。';
      const input = '【已填字段】\n'+Object.entries(card).filter(([k,v])=>k!=='id'&&k!=='createdAt'&&v).map(([k,v])=>k+': '+v).join('\n')+'\n\n【需要补全的字段】\n'+fields.join(', ');
      const payload = { model:state.model, messages:[{role:'system',content:sys},{role:'user',content:input}], stream:false, max_tokens:2000, temperature:0.85 };
      const reqHeaders = {'Content-Type':'application/json'};
      if(state.apiKey) reqHeaders['Authorization'] = 'Bearer '+state.apiKey;
      const res = await fetch(apiEndpoint(), { method:'POST', headers:reqHeaders, body:JSON.stringify(payload) });
      if(!res.ok){ let d=''; try{d=(await res.json()).error?.message||''}catch{} throw new Error(res.status+' '+d); }
      const data = await res.json();
      const text = data.choices?.[0]?.message?.content || '';
      let jsonStr = text.replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'').trim();
      // 多次重试：如果首次解析失败，尝试从文本中提取首个完整 JSON 块
      let obj = null;
      let lastErr = null;
      try { obj = JSON.parse(jsonStr); } catch(e) { lastErr = e; }
      if(!obj){
        // 尝试提取内嵌的 { ... } 块
        const m = jsonStr.match(/\{[\s\S]*\}/);
        if(m){
          try { obj = JSON.parse(m[0]); } catch(e2) { lastErr = e2; }
        }
      }
      if(!obj || typeof obj !== 'object') throw new Error('AI 输出格式不正确，请重试');
      return obj;
    }

    // ===== 世界书（Lorebook，对齐酒馆 World Info）=====
    // 数据模型：agent.lorebook = [{ id, keys:[], content, constant, enabled, order }]
    // 注入规则见 buildSystem：常驻条目每轮注入；关键词条目命中最近对话时注入，按 order 排序。

    function activeLorebook(){
      let a = activeAgent();
      if(!a) return null;
      if(Array.isArray(a.lorebook)) return a.lorebook;
      // 内置卡首次写入世界书时先复制为「我的角色」，避免污染服务端下发的模板（与编辑内置卡的行为一致）
      if(isBuiltinId(a.id) && !state.agents.some(x=>x.id===a.id)){
        const copy = JSON.parse(JSON.stringify(a));
        state.agents.push(copy);
        a = copy;
      }
      a.lorebook = [];
      return a.lorebook;
    }

    // 酒馆 World Info JSON → 本站条目（兼容 entries 数组 / uid→对象映射两种形态，及 originalData 包裹）
    function parseStWorldbook(obj){
      let root = obj;
      if(root && !root.entries && root.originalData && root.originalData.entries) root = root.originalData;
      let raw = [];
      if(root && Array.isArray(root.entries)) raw = root.entries;
      else if(root && root.entries && typeof root.entries === 'object') raw = Object.values(root.entries);
      else if(Array.isArray(root)) raw = root;
      return raw.filter(e=>e && typeof e==='object' && String(e.content||'').trim()).map(e=>({
        id: uid(),
        keys: Array.isArray(e.key) ? e.key.map(k=>String(k||'').trim()).filter(Boolean) : (typeof e.key==='string' ? [e.key.trim()].filter(Boolean) : []),
        content: String(e.content).trim(),
        constant: !!e.constant,
        enabled: e.disabled !== true,
        order: Number.isFinite(Number(e.order)) ? Number(e.order) : 0
      }));
    }

    // 本站条目 → 酒馆 World Info JSON（round-trip：本站导出的文件可直接回导酒馆或本站）
    function lorebookToSt(list){
      const entries = {};
      (list||[]).forEach((e,i)=>{
        entries[String(i)] = { uid:i, key:(e.keys||[]).slice(), keysecondary:[], comment:'', content:e.content||'', constant:!!e.constant, selective:true, order:e.order||0, disabled:e.enabled===false };
      });
      return { entries };
    }

    function renderWorldbook(){
      const host = $('#wbList'); if(!host) return;
      const agent = activeAgent();
      if(!agent){ host.innerHTML = '<div class="wb-empty">还没有角色。<br>请先在左侧创建或选择一个角色，再为其配置世界书。</div>'; return; }
      const lb = Array.isArray(agent.lorebook) ? agent.lorebook : [];
      if(!lb.length){ host.innerHTML = '<div class="wb-empty">「'+escapeHtml(agent.name)+'」还没有世界书条目。<br>可导入酒馆（SillyTavern）World Info JSON，或点「＋ 新增条目」手动创建。</div>'; return; }
      host.innerHTML = lb.map((e,i)=>{
        const keys = (e.keys&&e.keys.length) ? e.keys.map(k=>'<span class="wb-key'+(e.constant?' always':'')+'">'+escapeHtml(k)+'</span>').join('') : '';
        const badge = e.constant ? '<span class="wb-key always">常驻</span>' : '';
        const none = (keys||badge) ? '' : '<span class="wb-key">未设关键词</span>';
        return '<div class="wb-entry'+(e.enabled===false?' off':'')+'" data-idx="'+i+'"><div class="wb-entry-head"><div class="wb-keys">'+keys+badge+none+'</div><div class="wb-entry-btns"><button data-act="toggle">'+(e.enabled===false?'启用':'停用')+'</button><button data-act="edit">编辑</button><button data-act="del" class="danger">删除</button></div></div><div class="wb-entry-content">'+escapeHtml(e.content||'')+'</div></div>';
      }).join('');
      host.querySelectorAll('.wb-entry-content').forEach(el=>{ if(el.scrollHeight > el.clientHeight + 4) el.classList.add('fade'); });
      host.querySelectorAll('.wb-entry').forEach(el=>{
        const idx = +el.dataset.idx;
        el.querySelectorAll('button').forEach(b=>b.onclick=()=>{
          const lb = activeLorebook(); const e = lb && lb[idx]; if(!e) return;
          if(b.dataset.act==='toggle'){ e.enabled = e.enabled===false; saveState(); renderWorldbook(); toast(e.enabled===false?'条目已停用':'条目已启用'); }
          else if(b.dataset.act==='edit'){ openLoreEntryEditor(idx); }
          else if(b.dataset.act==='del'){ confirmDialog('删除条目','将删除该世界书条目，此操作无法撤销。','删除',()=>{ lb.splice(idx,1); saveState(); closeModal(); renderWorldbook(); toast('条目已删除'); }); }
        });
      });
    }

    function openLoreEntryEditor(idx){
      const lb = activeLorebook();
      if(!lb) return toast('请先选择一个角色');
      const isNew = typeof idx !== 'number';
      const e = isNew ? {id:uid(),keys:[],content:'',constant:false,enabled:true,order:lb.length} : lb[idx];
      if(!e) return;
      openModal(`<h2>${isNew?'新增':'编辑'}世界书条目</h2><p class="hint">当最近对话出现任一关键词时，条目内容会注入系统提示；设为「常驻」则不依赖关键词、每轮注入。</p><div class="form-group"><label>触发关键词 <small>（逗号分隔；留空则必须设为常驻）</small></label><input id="loreKeys" placeholder="例如：雾城, 教堂, 旧怀表" value="${escapeHtml((e.keys||[]).join(', '))}"></div><div class="form-group"><label>条目内容 <small>（世界观、背景、伏笔、设定…）</small></label><textarea id="loreContent" style="min-height:130px" placeholder="当关键词出现时注入给模型的设定资料…">${escapeHtml(e.content||'')}</textarea></div><div class="form-group"><label><input id="loreConstant" type="checkbox" ${e.constant?'checked':''} style="width:auto;margin-right:6px;vertical-align:-2px"> 常驻（不依赖关键词，每轮注入）</label></div><div class="modal-footer"><button class="btn ghost" id="cancel">取消</button><button class="btn primary" id="saveLore">保存条目</button></div>`,()=>{
        $('#cancel').onclick=closeModal;
        $('#saveLore').onclick=()=>{
          const keys=$('#loreKeys').value.split(/[,，;；]+/).map(s=>s.trim()).filter(Boolean);
          const content=$('#loreContent').value.trim();
          const constant=$('#loreConstant').checked;
          if(!content) return toast('请填写条目内容');
          if(!keys.length && !constant) return toast('未设关键词的条目必须勾选「常驻」，否则永远不会触发');
          e.keys=keys; e.content=content; e.constant=constant;
          if(isNew) lb.push(e);
          saveState(); closeModal(); renderWorldbook(); toast('世界书条目已保存');
        };
      });
    }

    function openAgentEditor(agent){
      const edit = !!agent;
      agent = agent || {id:uid(), name:'', emoji:'✦', description:'', baseDirective:'', persona:'', initialScene:'', relationship:'', userProfile:''};
      // 内置卡（前端 defaults + 服务端 builtinCards）走"软删除：加入 hiddenBuiltins"，自定义走"硬删除：从 agents 移除"
      const builtin = isBuiltinId(agent.id);
      openModal(`<h2>${edit?'编辑角色':'创建角色'}</h2><p class="hint">只提供角色的人设与世界观环境即可，开场白与剧情走向交给 AI 自行想象。</p><div class="form-group"><label>角色名称</label><input id="agentName" maxlength="24" placeholder="例如：初音未来" value="${escapeHtml(agent.name)}"></div><div class="form-group"><label>图标 Emoji</label><input id="agentEmoji" maxlength="4" value="${escapeHtml(agent.emoji||'✦')}"></div><div class="form-group"><label>角色简介</label><input id="agentDesc" maxlength="60" placeholder="例如：虚拟歌姬，元气满满地为你歌唱" value="${escapeHtml(agent.description||'')}"></div><div class="form-group"><label>角色底层输出设定 <small>（最高优先级）</small></label><textarea id="baseDirective" placeholder="强制规则：角色说话的语气风格、绝对不能做的事、必须遵守的输出规范…（优先级高于其余所有设定）">${escapeHtml(agent.baseDirective||'')}</textarea></div><div class="form-group"><label>角色人设</label><textarea id="agentPersona" placeholder="性格、语言习惯、目标、秘密…">${escapeHtml(agent.persona||'')}</textarea></div><div class="form-group"><label>我的设定（你扮演的角色）</label><textarea id="userProfile" placeholder="我是谁？身份、形象、性格、目标、秘密…（留空则让 AI 自行推断）">${escapeHtml(agent.userProfile||'')}</textarea></div><div class="form-group"><label>剧情初始环境</label><textarea id="initialScene" placeholder="剧情开始时，角色和用户所处的地点、时间、天气、气氛、正在发生的事…">${escapeHtml(agent.initialScene||'')}</textarea></div><div class="form-group"><label>你与角色的关系</label><input id="agentRelationship" maxlength="100" placeholder="例如：我们是搭档，也是彼此最信任的人" value="${escapeHtml(agent.relationship||'')}"></div><input id="roleFileInput" type="file" accept=".json,.txt,.md,.png,text/plain,application/json,image/png" hidden><div class="form-group"><button type="button" class="btn ghost" id="importRoleButton">↥ 导入角色设定</button><div class="form-note">支持导入酒馆（SillyTavern）PNG / JSON 角色卡（V2/V3 自动映射字段），或 TXT / Markdown 世界书；文本 ≤300 KB、PNG ≤10 MB，文件仅在本机解析。</div></div><div class="modal-footer">${edit?'<button class="btn danger" id="deleteAgent">删除</button>':''}<span style="flex:1"></span><button class="btn ghost" id="cancel">取消</button><button class="btn primary" id="saveAgent">保存角色</button></div>`,()=>{$('#cancel').onclick=closeModal;$('#importRoleButton').onclick=()=>$('#roleFileInput').click();$('#roleFileInput').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;const isPng=/\.png$/i.test(file.name)||file.type==='image/png';const max=isPng?10*1024*1024:300*1024;if(file.size>max){toast(isPng?'PNG 角色卡不能超过 10 MB':'文件不能超过 300 KB');e.target.value='';return;}try{if(isPng){const card=parsePngCharaCard(await file.arrayBuffer());if(!card)throw new Error('no card data');fillFormFromCard(normalizeImportCard(card));toast('酒馆角色卡已导入');}else{const raw=(await file.text()).trim();if(!raw)throw new Error('文件为空');if(/\.json$/i.test(file.name)){fillFormFromCard(normalizeImportCard(JSON.parse(raw)));toast('角色卡已导入');}else{$('#initialScene').value=raw;toast('文本已导入到剧情初始环境');}}}catch(err){toast(isPng?'导入失败：PNG 中未找到有效的角色卡数据（需为酒馆 V2/V3 卡）':'导入失败：请使用有效的 JSON、TXT 或 Markdown 文件');}finally{e.target.value='';}};$('#saveAgent').onclick=()=>{const name=$('#agentName').value.trim();if(!name)return toast('请填写角色名称');const data={...agent,name,emoji:$('#agentEmoji').value.trim()||'✦',description:$('#agentDesc').value.trim(),baseDirective:$('#baseDirective').value.trim(),persona:$('#agentPersona').value.trim(),initialScene:$('#initialScene').value.trim(),relationship:$('#agentRelationship').value.trim(),userProfile:$('#userProfile').value.trim()};const wasBuiltin=isBuiltinId(data.id);if(edit&&state.agents.some(a=>a.id===data.id))state.agents=state.agents.map(a=>a.id===data.id?data:a);else{state.agents.push(data);state.activeId=data.id;}if(wasBuiltin){const hi=state.hiddenBuiltins.indexOf(data.id);if(hi>-1)state.hiddenBuiltins.splice(hi,1);}saveState();closeModal();render();toast(edit?(wasBuiltin?'已保存为我的角色（内置卡不受影响）':'角色已更新'):'角色已创建');};const del=$('#deleteAgent');if(del){del.onclick=()=>confirmDialog('删除角色',builtin?'将从你的列表中移除该内置角色，并删除其本地剧情记忆。可在「内置角色库」中随时重新加入。':'此操作会同时删除该角色的剧情记忆，无法恢复。','删除',()=>{state.agents=state.agents.filter(a=>a.id!==agent.id);if(!state.hiddenBuiltins.includes(agent.id))state.hiddenBuiltins.push(agent.id);delete state.chats[agent.id];delete state.play[agent.id];const list=allAgents();state.activeId=list[0]?.id||'';saveState();closeModal();render();toast('角色已删除');});}});
    }
    function confirmDialog(title,detail,ok,fn){openModal(`<h2>${title}</h2><p class="hint">${detail}</p><div class="modal-footer"><button class="btn ghost" id="cancel">取消</button><button class="btn danger" id="confirm">${ok}</button></div>`,()=>{$('#cancel').onclick=closeModal;$('#confirm').onclick=fn;});}
    // 内置角色库：从服务端 KV 下发的卡中挑选加入（已加入 / 曾移除的都可再添加）
    function openBuiltinLibrary(){
      const builtin=state.builtinCards||[], mine=new Set(allAgents().map(a=>a.id));
      const items=builtin.map(c=>`<div class="lib-item"><div class="lib-avatar">${escapeHtml(c.emoji||'✦')}</div><div class="lib-info"><div class="lib-name">${escapeHtml(c.name)}</div><div class="lib-desc">${escapeHtml(c.description||'')}</div></div><button class="lib-add" data-add="${escapeHtml(c.id)}" ${mine.has(c.id)?'disabled':''}>${mine.has(c.id)?'已加入':'加入'}</button></div>`).join('');
      openModal(`<h2>内置角色库</h2><p class="hint">由服务端维护的精选角色卡。加入后可在侧栏使用，编辑只会保存到你自己的列表，不会影响内置卡。</p><div class="lib-list">${items||'<p class="form-note">暂无可用内置角色</p>'}</div><div class="modal-footer"><button class="btn primary" id="closeLib">完成</button></div>`,()=>{$('#closeLib').onclick=closeModal;document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const id=b.dataset.add;const card=builtin.find(c=>c.id===id);if(!card)return;state.agents.push({...card});state.hiddenBuiltins=state.hiddenBuiltins.filter(x=>x!==id);state.activeId=id;saveState();b.disabled=true;b.textContent='已加入';render();toast('已加入：'+card.name);});});
    }

    function closeSide(){$('#sidebar').classList.remove('open');$('#overlay').classList.remove('show');}

    $('#addAgent').onclick=()=>openAgentEditor();
    $('#openLibrary').onclick=openBuiltinLibrary;
    $('#editAgent').onclick=()=>openAgentEditor(activeAgent());
    $('#openSettings').onclick=openSettings;
    $('#menuButton').onclick=()=>{$('#sidebar').classList.add('open');$('#overlay').classList.add('show');};
    $('#overlay').onclick=closeSide;
    $('#modalLayer').onclick=e=>{if(e.target===$('#modalLayer'))closeModal();};
    $('#restartChat').onclick=()=>{if(!chat().length)return toast('当前对话还没有消息');confirmDialog('重启对话','将清空「'+activeAgent().name+'」的全部对话记忆、状态、场景与剧情摘要，此操作无法撤销。','清空对话',()=>{state.chats[state.activeId]=[];const p=play();p.roleState='';p.scene=activeAgent().initialScene||'';p.summaries=[];p.summarizedUpTo=0;p._init=true;saveState();closeModal();render();toast('已重启对话');});};
    $('#clearAllMemory').onclick=()=>{const count=Object.values(state.chats).reduce((total,list)=>total+(Array.isArray(list)?list.length:0),0);if(!count)return toast('目前没有可清空的记忆');confirmDialog('清空全部记忆','将删除所有智能体的 '+count+' 条本地对话记录与状态。智能体和 API 设置会保留，此操作无法撤销。','全部清空',()=>{state.chats={};state.play={};saveState();closeModal();render();toast('已清空全部记忆与对话');});};
    $('#sendButton').onclick=()=>{ if(state.busy){ stopGeneration(); return; } sendMessage($('#prompt').value); };
    $('#prompt').addEventListener('input',autoResize);
    $('#prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();sendMessage(e.currentTarget.value);}});
    $('#memoryToggle').onchange=e=>{state.memory=e.target.checked;saveState();toast(state.memory?'已开启对话记忆':'已关闭对话记忆');};
    $('#attachFile').onclick=()=>$('#chatFileInput').click();
    $('#chatFileInput').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;if(file.size>256*1024){toast('附件不能超过 256 KB');e.target.value='';return;}try{const content=(await file.text()).trim();if(!content)throw new Error('文件为空');state.attachment={name:file.name,content:content.slice(0,120000)};renderAttachment();toast('已附加：'+file.name);$('#prompt').focus();}catch(err){toast('附件读取失败');}finally{e.target.value='';}};
    $('#removeAttachment').onclick=()=>{state.attachment=null;renderAttachment();};

    function setMode(mode){ if(mode===state.mode) return; state.mode=mode; saveState(); render(); closeSide(); }
    document.querySelectorAll('#modeSwitch .mode-btn').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
    // 世界书事件绑定
    $('#wbAddBtn').onclick = ()=>openLoreEntryEditor();
    $('#wbImportBtn').onclick = ()=>$('#wbFileInput').click();
    $('#wbExportBtn').onclick = ()=>{
      const agent = activeAgent();
      if(!agent) return toast('请先选择一个角色');
      const lb = Array.isArray(agent.lorebook) ? agent.lorebook : [];
      if(!lb.length) return toast('当前角色还没有世界书条目');
      downloadJson(lorebookToSt(lb), (agent.name||'角色')+'-世界书.json');
      toast('已导出 '+lb.length+' 条（酒馆 World Info 格式）');
    };
    $('#wbFileInput').onchange = async e=>{
      const file = e.target.files && e.target.files[0];
      if(!file) return;
      try{
        if(file.size > 2*1024*1024){ toast('世界书文件不能超过 2 MB'); return; }
        const list = parseStWorldbook(JSON.parse(await file.text()));
        if(!list.length) throw new Error('empty');
        const lb = activeLorebook();
        if(!lb){ toast('请先选择一个角色'); return; }
        lb.push(...list); saveState(); renderWorldbook();
        toast('已导入 '+list.length+' 条世界书条目');
      }catch{ toast('导入失败：请使用酒馆（SillyTavern）World Info JSON 文件'); }
      finally{ e.target.value=''; }
    };

    // 工坊事件绑定
    document.querySelectorAll('.ai-fill-btn[data-fill]').forEach(b=>b.onclick=()=>aiFillCard(b.dataset.fill));
    $('#shopAiFillAll').onclick = ()=>aiFillCard(null);
    $('#shopSaveDraft').onclick = shopSaveDraft;
    $('#shopExportJson').onclick = shopExportJson;
    $('#shopExportBatch').onclick = shopExportBatch;
    $('#shopAddAgent').onclick = ()=>{
      const card = shopReadForm();
      const idx = state.shopEditingId ? state.workshopDrafts.findIndex(d=>d.id===state.shopEditingId) : -1;
      shopAddToAgents(card, idx);
    };
    $('#shopClearDrafts').onclick = ()=>{
      if(!state.workshopDrafts.length){ toast('草稿区已空'); return; }
      confirmDialog('清空草稿区','将删除草稿区的 '+state.workshopDrafts.length+' 张草稿，此操作无法撤销。','全部清空',()=>{ state.workshopDrafts=[]; state.shopEditingId=null; saveState(); renderShopDrafts(); closeModal(); toast('已清空草稿区'); });
    };
    $('#shopClearForm').onclick = ()=>{
      confirmDialog('清空表单','将清空当前正在编辑的全部字段，从空白重新开始。','清空',()=>{
        Object.values(WORKSHOP_FIELDS).forEach(id=>{ const el=$('#'+id); if(el) el.value=''; });
        state.shopEditingId = null;
        state.shopActiveTpl = 'blank';
        $('#shopFormTitle').textContent = '新建角色卡';
        document.querySelectorAll('#shopTemplates .shop-tpl').forEach(x=>x.classList.toggle('active', x.dataset.tpl==='blank'));
        closeModal(); toast('已清空表单');
      });
    };

    loadState(); (async()=>{ await loadBuiltinCards(); render(); })(); refreshGatewayStatus();
    setSendButtonMode();
    // 页面卸载/隐藏时中断进行中的流式请求，避免悬挂连接
    window.addEventListener('pagehide', stopGeneration);

</script>
</body>
</html>
